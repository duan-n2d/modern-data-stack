import json

from confluent_kafka import Producer

p = Producer({
    "bootstrap.servers": "broker1:9092",
    "enable.idempotence": True,
    "acks": "all",
    "partitioner": "murmur2_random",   # same hashing as the Java client for keyed records
    "linger.ms": 20,
})


def on_delivery(err, msg):
    if err:
        print(f"failed: {err}")
    else:
        print(f"partition={msg.partition()} offset={msg.offset()}")


def send_order(order: dict) -> None:
    # Same customer_id -> same partition -> one customer's events stay ordered
    p.produce("orders", key=str(order["customer_id"]), value=json.dumps(order), on_delivery=on_delivery)
    p.poll(0)


def send_hot_key(order: dict, salts: int = 8) -> None:
    # Spread a very hot customer over several partitions. Ordering per customer is lost.
    key = f"{order['customer_id']}#{order['order_id'] % salts}"
    p.produce("orders", key=key, value=json.dumps(order), on_delivery=on_delivery)
    p.poll(0)


p.flush()`}

     var cd = codeBlock({lang:'sql', title:'orders_tumbling_window.sql (Flink SQL)', code:`
CREATE TABLE orders (
    order_id    BIGINT,
    customer_id BIGINT,
    amount      DECIMAL(10, 2),
    order_ts    TIMESTAMP(3),
    WATERMARK FOR order_ts AS order_ts - INTERVAL '5' SECOND
) WITH (
    'connector' = 'kafka',
    'topic' = 'orders',
    'properties.bootstrap.servers' = 'broker1:9092',
    'properties.group.id' = 'flink-orders',
    'scan.startup.mode' = 'earliest-offset',
    'format' = 'json'
);

SELECT window_start, window_end, COUNT(*) AS orders, SUM(amount) AS revenue
FROM TABLE(TUMBLE(TABLE orders, DESCRIPTOR(order_ts), INTERVAL '1' MINUTE))
GROUP BY window_start, window_end;`});

 { k:'code', t:L('Iceberg internals: snapshots, maintenance and concurrency','Nội bộ Iceberg: snapshot, bảo trì và đồng thời'),
   lead:L('Every commit creates a snapshot. Maintenance keeps metadata small, files large and storage bounded.','Mỗi commit tạo một snapshot. Bảo trì giữ metadata nhỏ, file lớn và dung lượng có giới hạn.'),
   blocks:[
    {lang:'sql', title:'inspect_and_time_travel.sql (Spark SQL)', code:`
SELECT * FROM catalog.db.orders.snapshots;         -- every commit
SELECT * FROM catalog.db.orders.manifests;         -- manifest files and stats
SELECT file_path, record_count, file_size_in_bytes FROM catalog.db.orders.files;

SELECT * FROM catalog.db.orders VERSION AS OF 4871234567890;
SELECT * FROM catalog.db.orders TIMESTAMP AS OF '2026-11-01 00:00:00';`},
    {lang:'sql', title:'maintenance.sql (run on a schedule)', code:`
-- 1) Compact small files toward a target size
CALL catalog.system.rewrite_data_files(
    table => 'db.orders',
    options => map('target-file-size-bytes', '536870912')
);

-- 2) Rewrite manifests so planning stays fast
CALL catalog.system.rewrite_manifests('db.orders');

-- 3) Drop old snapshots (this removes time travel to them)
CALL catalog.system.expire_snapshots(
    table => 'db.orders',
    older_than => TIMESTAMP '2026-10-01 00:00:00',
    retain_last => 5
);

-- 4) Delete files no snapshot references
CALL catalog.system.remove_orphan_files(table => 'db.orders');`}
   ],
   points:[
    {h:L('Snapshot lifecycle','Vòng đời snapshot'), p:L('Each commit adds a snapshot; expiring snapshots lets unreferenced files be deleted. Time travel only works for retained snapshots.','Mỗi commit thêm một snapshot; hết hạn snapshot cho phép xóa file không còn được tham chiếu. Time travel chỉ hoạt động với snapshot còn giữ.')},
    {h:L('Optimistic concurrency','Đồng thời lạc quan'), tag:'senior', p:L('Writers commit by swapping the catalog pointer. If another writer won, Iceberg validates for conflicts and retries, or fails when changes overlap.','Writer commit bằng cách đổi con trỏ catalog. Nếu writer khác thắng, Iceberg kiểm tra xung đột và retry, hoặc thất bại khi thay đổi chồng lấn.')},

      {lang:'python', title:'async_fetch.py (many IO waits)', code:`
import asyncio

import httpx


async def fetch_all(urls: list[str], limit: int = 10) -> list[dict]:
    sem = asyncio.Semaphore(limit)  # bounded concurrency protects the API

    async with httpx.AsyncClient(timeout=30) as client:
        async def one(url: str) -> dict:
            async with sem:
                r = await client.get(url)
                r.raise_for_status()
                return r.json()

        return await asyncio.gather(*(one(u) for u in urls))`},

<script>
"use strict";

function flowRow(list, y, h, x0, x1, gap){
  var n = list.length, w = (x1 - x0 - (n - 1) * gap) / n, s = '';
  list.forEach(function(b, i){
    var x = x0 + i * (w + gap);
    s += bx(x, y, w, h, b[0], b[1], b[2]);
    if(i < n - 1) s += arrow(x + w + 2, y + h / 2, x + w + gap - 3, y + h / 2);
  });
  return s;
}
function bar(y, title, sub, color){

}

    {lang:'sql', title:'orders_cdc_to_iceberg.sql (Flink SQL)', code:`
CREATE TABLE orders_cdc (
    order_id    BIGINT,
    customer_id BIGINT,
    status      STRING,
    amount      DECIMAL(10, 2),
    updated_at  TIMESTAMP(3),
    PRIMARY KEY (order_id) NOT ENFORCED,
    WATERMARK FOR updated_at AS updated_at - INTERVAL '10' SECOND
) WITH (
    'connector' = 'kafka',
    'topic' = 'shop.public.orders',
    'properties.bootstrap.servers' = 'broker1:9092',
    'properties.group.id' = 'flink-orders-cdc',
    'scan.startup.mode' = 'earliest-offset',
    'format' = 'debezium-json'
);

CREATE CATALOG lake WITH (
    'type' = 'iceberg', 'catalog-type' = 'rest',
    'uri' = 'http://polaris:8181/api/catalog', 'warehouse' = 'lake'
);  -- plus the credentials your catalog requires

CREATE TABLE IF NOT EXISTS lake.silver.orders_current (
    order_id BIGINT, customer_id BIGINT, status STRING,
    amount DECIMAL(10, 2), updated_at TIMESTAMP(3),
    PRIMARY KEY (order_id) NOT ENFORCED
) WITH ('format-version' = '2', 'write.upsert.enabled' = 'true');

INSERT INTO lake.silver.orders_current
SELECT order_id, customer_id, status, amount, updated_at FROM orders_cdc;`},
    {lang:'sql', title:'repair_merge.sql (Spark SQL, safe to rerun)', code:`
MERGE INTO lake.silver.orders_current t
USING (
    SELECT * FROM (
        SELECT *, ROW_NUMBER() OVER (
            PARTITION BY order_id ORDER BY source_lsn DESC, event_ts DESC) AS rn
        FROM lake.bronze.orders_cdc
        WHERE ingest_date = current_date()
    ) WHERE rn = 1
) s ON t.order_id = s.order_id
WHEN MATCHED AND s.op = 'd' THEN DELETE
WHEN MATCHED AND s.source_lsn > t.source_lsn THEN UPDATE SET *
WHEN NOT MATCHED AND s.op <> 'd' THEN INSERT *;`}

 { k:'code', t:L('Scenario B implementation: DAG, backfill and rollback','Kịch bản B triển khai: DAG, backfill và rollback'),
   lead:L('A reconciliation gate before dbt, a bounded backfill, and a schema swap for rollback.','Cổng đối soát trước dbt, backfill có giới hạn và hoán đổi schema để rollback.'),

    {lang:'python', title:'warehouse_daily.py', code:`
import pendulum
from airflow.decorators import dag, task
from airflow.operators.bash import BashOperator


@dag(
    dag_id="warehouse_daily",
    schedule="0 2 * * *",
    start_date=pendulum.datetime(2026, 1, 1, tz="UTC"),
    catchup=False,
    max_active_runs=2,
)
def warehouse_daily():
    @task(retries=3)
    def extract_load(ds=None) -> int:
        rows = load_partition_from_source(ds)         # idempotent: overwrite the partition for ds
        return rows

    @task
    def reconcile(ds=None, loaded_rows: int = 0) -> None:
        source_rows = count_source_rows(ds)
        if source_rows != loaded_rows:
            raise ValueError(f"{ds}: source {source_rows} != loaded {loaded_rows}")

    dbt_build = BashOperator(
        task_id="dbt_build",
        bash_command="cd /opt/dbt && dbt build --target prod --vars \\"{run_date: '{{ ds }}'}\\"",
    )

    reconcile(loaded_rows=extract_load()) >> dbt_build


warehouse_daily()`},

from pyspark.sql import functions as F

events = (
    spark.readStream.format("kafka")
    .option("kafka.bootstrap.servers", "broker1:9092")
    .option("subscribe", "events")
    .option("startingOffsets", "earliest")
    .load()
    .select(F.from_json(F.col("value").cast("string"), schema).alias("e"))
    .select("e.*")
)

query = (
    events.writeStream.format("iceberg")
    .outputMode("append")
    .trigger(processingTime="1 minute")
    .option("checkpointLocation", "s3a://lake/checkpoints/events")
    .toTable("lake.bronze.events")
)
query.awaitTermination()`}

<script>
"use strict";

function incidentSlide(o){
  var rows = [
    [L('1. Symptoms','1. Triệu chứng'), o.sym], [L('2. Business impact','2. Tác động nghiệp vụ'), o.impact], [L('3. Possible root causes','3. Nguyên nhân gốc có thể'), o.causes],
    [L('4. Evidence to collect','4. Bằng chứng cần thu thập'), o.evidence], [L('5. Diagnostic procedure','5. Quy trình chẩn đoán'), o.diag], [L('6. Resolution options and trade-offs','6. Phương án xử lý và đánh đổi'), o.fix],
    [L('7. Prevention','7. Phòng ngừa'), o.prev], [L('8. Postmortem','8. Postmortem'), o.post]
  ];
  return { k:'table', t:o.t, lead:L('A composite teaching example, not a report of a real company incident.','Ví dụ giảng dạy tổng hợp, không phải báo cáo sự cố của một công ty thật.'),
    head:[L('Step','Bước'), L('Content','Nội dung')], rows:rows, n:o.n };
}

PRACTICE.push({ name:L('Incident knowledge base','Kho tri thức sự cố'), color:'#DC2626', slides:[

 { k:'cards', cols:2, t:L('The incident format: eight steps','Định dạng sự cố: tám bước'),
   lead:L('Use the same eight sections for every incident and every runbook. The format is what turns an incident into learning.','Dùng cùng tám mục cho mọi sự cố và mọi runbook. Định dạng là thứ biến sự cố thành bài học.'),

    {h:L('3. Possible root causes and 4. Evidence','3. Nguyên nhân gốc có thể và 4. Bằng chứng'), p:L('List hypotheses, and for each the evidence that would confirm or reject it: logs, metrics, queries, recent changes.','Liệt kê các giả thuyết, và với mỗi giả thuyết là bằng chứng xác nhận hoặc bác bỏ: log, metric, query, thay đổi gần đây.')},

    {h:L('8. Postmortem','8. Postmortem'), p:L('Blameless review: timeline, what worked, what did not, and the follow-up actions that are tracked to completion.','Review không đổ lỗi: dòng thời gian, cái gì tốt, cái gì chưa tốt, và các hành động tiếp theo được theo dõi đến khi hoàn tất.')}

 incidentSlide({ t:L('Incident example 1 (data correctness): duplicated revenue after a backfill','Ví dụ sự cố 1 (tính đúng dữ liệu): doanh thu bị nhân đôi sau backfill'),

insertLab(15, labSlide({ t:L('AI engineering lab: RAG with evaluation and access controls','Lab AI: RAG có đánh giá và kiểm soát truy cập'),

insertLab(17, labSlide({ t:L('Security lab: threat-model a data pipeline','Lab bảo mật: threat model một data pipeline'),

insertLab(18, labSlide({ t:L('Reliability lab: simulate failures and recover','Lab độ tin cậy: mô phỏng sự cố và khôi phục'),

function lifecycleDESVG(){
  var s = flowRow([
    [L('Generation','Sinh dữ liệu'), L('apps, databases,|IoT, SaaS','ứng dụng, database,|IoT, SaaS'), '#7A869F'],
    [L('Storage','Lưu trữ'), L('warehouse, lake,|lakehouse','warehouse, lake,|lakehouse'), '#7C3AED'],
    [L('Ingestion','Nạp dữ liệu'), L('batch, CDC,|streaming','batch, CDC,|streaming'), '#0891B2'],
    [L('Transformation','Biến đổi'), L('clean, model,|aggregate','làm sạch, mô hình,|tổng hợp'), '#EA580C'],
    [L('Serving','Phục vụ'), L('BI, ML, APIs,|reverse ETL','BI, ML, API,|reverse ETL'), '#B45309']
  ], 20, 100, 10, 990, 30);
  s += txt(10, 150, L('Layers: generation (sources) · storage 3 · ingestion 2 · transformation 4 · serving 7, 10, 15','Layer: sinh dữ liệu (nguồn) · lưu trữ 3 · nạp 2 · biến đổi 4 · phục vụ 7, 10, 15'), 'sm');
  s += txt(10, 184, L('Undercurrents: they cut across every stage','Dòng chảy ngầm: cắt ngang mọi giai đoạn'), 'lg');
  var u = [[L('Security','Bảo mật'), L('layer 17','layer 17'), '#B91C1C'], [L('Data management','Quản trị dữ liệu'), L('layers 6, 8, 9, 12','layer 6, 8, 9, 12'), '#0F766E'], [L('DataOps','DataOps'), L('layers 8, 11','layer 8, 11'), '#475569'],
           [L('Data architecture','Kiến trúc dữ liệu'), L('layers 3, 12, 18','layer 3, 12, 18'), '#7C3AED'], [L('Orchestration','Điều phối'), L('layer 5','layer 5'), '#16A34A'], [L('Software engineering','Kỹ nghệ phần mềm'), L('layers 1, 11, 20','layer 1, 11, 20'), '#2563EB']];
  u.forEach(function(x, i){
    var col = i % 3, row = Math.floor(i / 3), w = 316, xx = 10 + col * (w + 16), yy = 200 + row * 60;
    s += '<rect class="bx" x="' + xx + '" y="' + yy + '" width="' + w + '" height="48" rx="8"/><rect x="' + xx + '" y="' + yy + '" width="8" height="48" rx="4" fill="' + x[2] + '"/>' + txt(xx + 22, yy + 21, x[0], 'b') + txt(xx + 22, yy + 38, x[1], 'sm');
  });
  return svg(1000, 330, s, 'Data engineering lifecycle');
}
function parquetSVG(){
  var s = bx(10, 50, 80, 130, 'PAR1', L('magic|bytes','magic|bytes'), '#475569');
  s += '<rect class="bx2" x="110" y="20" width="380" height="190" rx="10"/>' + txt(126, 42, L('Row group 1 (about a million rows)','Row group 1 (khoảng một triệu dòng)'), 'b');
  [['user_id', 120], ['country', 238], ['amount', 356]].forEach(function(c){ s += bx(c[1], 56, 112, 140, c[0], L('column chunk|pages: dictionary,|RLE, bit-packing|min/max stats','column chunk|page: dictionary,|RLE, bit-packing|thống kê min/max'), '#1D4ED8'); });
  s += bx(510, 20, 180, 190, L('Row group 2, 3, …','Row group 2, 3, …'), L('same layout:|one column chunk|per column','cùng bố cục:|mỗi cột một|column chunk'), '#64748B', 'bx2');
  s += bx(710, 20, 190, 190, L('Footer','Footer'), L('schema|row group offsets|column statistics|(min, max, nulls)|read first','schema|offset row group|thống kê cột|(min, max, null)|đọc đầu tiên'), '#CA8A04');
  s += bx(920, 50, 70, 130, 'PAR1', L('magic|bytes','magic|bytes'), '#475569');
  s += arrow(805, 212, 805, 250) + txt(805, 268, L('a reader starts at the footer, skips row groups by statistics,','reader bắt đầu từ footer, bỏ qua row group nhờ thống kê,'), 'sm', 'middle') + txt(805, 284, L('then reads only the needed column chunks','rồi chỉ đọc các column chunk cần thiết'), 'sm', 'middle');
  return svg(1000, 300, s, 'Parquet file layout');
}

 { k:'table', t:L('The role: data engineer, software engineer, analytics engineer','Vai trò: data engineer, kỹ sư phần mềm, analytics engineer'),

 { k:'html', t:L('Normalization and denormalization','Chuẩn hóa và phi chuẩn hóa'),
   lead:L('Normalize to protect writes (OLTP). Denormalize to speed up reads (analytics). Know both and why.','Chuẩn hóa để bảo vệ thao tác ghi (OLTP). Phi chuẩn hóa để tăng tốc đọc (analytics). Hiểu cả hai và lý do.'),
   html:function(){
     var tb = tableHTML([L('Form','Dạng'), L('Rule','Quy tắc'), L('Problem it removes','Vấn đề nó loại bỏ')], [
      ['1NF', L('Atomic values; no repeating groups','Giá trị nguyên tử; không có nhóm lặp'), L('Lists stored in one cell','Danh sách lưu trong một ô')],
      ['2NF', L('1NF and no partial dependency on part of a composite key','1NF và không phụ thuộc một phần vào một phần của khóa ghép'), L('Attributes repeated for each part of the key','Thuộc tính lặp lại cho từng phần của khóa')],
      ['3NF', L('2NF and no transitive dependency (non-key depends on non-key)','2NF và không phụ thuộc bắc cầu (không-khóa phụ thuộc không-khóa)'), L('Update anomalies, such as changing a country name in many rows','Bất thường khi cập nhật, như đổi tên quốc gia ở nhiều dòng')],
      ['BCNF', L('Every determinant is a candidate key','Mọi determinant đều là khóa ứng viên'), L('Remaining anomalies from overlapping candidate keys','Bất thường còn lại do các khóa ứng viên chồng lấn')]
     ]);
     var cd = codeBlock({lang:'sql', title:'normalized_vs_denormalized.sql', code:`
-- Normalized (OLTP): each fact stored once, more joins
create table countries (country_id int primary key, country_name text not null);
create table customers (customer_id bigint primary key, name text, country_id int references countries(country_id));
create table orders (order_id bigint primary key, customer_id bigint references customers(customer_id),
                     ordered_at timestamp, amount numeric(10, 2));

-- Denormalized (analytics): wide and read-optimized, repeated values accepted
create table fct_orders_wide as
select o.order_id, o.ordered_at, o.amount, c.customer_id, c.name as customer_name, co.country_name
from orders o
join customers c using (customer_id)
join countries co using (country_id);`});
     var cards = '<div class="grid c2" style="margin:14px 0">' +
       cardHTML({h:X('Why normalize','Vì sao chuẩn hóa'), p:X('Updates touch one place, integrity is enforced by constraints, storage is small. Ideal for transactional systems.','Cập nhật chỉ chạm một nơi, toàn vẹn được ràng buộc ép buộc, dung lượng nhỏ. Lý tưởng cho hệ thống giao dịch.')}, true) +
       cardHTML({h:X('Why denormalize','Vì sao phi chuẩn hóa'), p:X('Fewer joins, simpler queries and faster scans on columnar engines. The cost is redundancy, so rebuild from the source of truth rather than updating in place.','Ít join hơn, query đơn giản hơn và quét nhanh hơn trên engine cột. Cái giá là dư thừa, nên hãy dựng lại từ nguồn sự thật thay vì cập nhật tại chỗ.')}, true) + '</div>';
     return tb + cards + cd;
   },
   n:L('Connect to section 12: star schemas are deliberately denormalized dimensions around a fact table.','Nối với phần 12: star schema là các dimension được phi chuẩn hóa có chủ đích quanh một bảng fact.') },

 { k:'table', t:L('Inmon versus Kimball (and Data Vault)','Inmon so với Kimball (và Data Vault)'),
   lead:L('Two classic warehouse philosophies. Many real platforms mix them: an integrated, history-preserving core with dimensional marts on top.','Hai triết lý warehouse kinh điển. Nhiều nền tảng thật kết hợp cả hai: một lõi tích hợp có lưu lịch sử với các mart dimensional phía trên.'),
   head:[L('Aspect','Khía cạnh'), L('Inmon','Inmon'), L('Kimball','Kimball'), L('Data Vault','Data Vault')], rows:[
   [L('Direction','Hướng đi'), L('Top-down: build an enterprise warehouse first','Từ trên xuống: xây warehouse doanh nghiệp trước'), L('Bottom-up: build business-process marts that share conformed dimensions','Từ dưới lên: xây mart theo quy trình nghiệp vụ dùng chung dimension conformed'), L('Integration layer first, marts later','Lớp tích hợp trước, mart sau')],
   [L('Core model','Mô hình lõi'), L('Normalized (about 3NF) enterprise model','Mô hình doanh nghiệp đã chuẩn hóa (khoảng 3NF)'), L('Star schemas of facts and dimensions','Star schema gồm fact và dimension'), L('Hubs, links and satellites','Hub, link và satellite')],

   [L('Strengths','Điểm mạnh'), L('One integrated, consistent source of truth','Một nguồn sự thật tích hợp và nhất quán'), L('Business-friendly, fast queries, BI-ready','Thân thiện nghiệp vụ, query nhanh, sẵn sàng cho BI'), L('Handles change and auditability well','Xử lý thay đổi và khả năng audit tốt')],
   [L('Weaknesses','Điểm yếu'), L('Complex and slow to deliver; marts still needed','Phức tạp và giao chậm; vẫn cần mart'), L('Needs discipline on conformed dimensions across teams','Cần kỷ luật về dimension conformed giữa các đội'), L('Many tables and joins; needs a presentation layer','Nhiều bảng và join; cần lớp trình bày')],
   [L('Best when','Phù hợp khi'), L('A central team governs a stable enterprise model','Một đội trung tâm quản trị mô hình doanh nghiệp ổn định'), L('You need analytics answers quickly in a few domains','Bạn cần câu trả lời analytics nhanh ở vài domain'), L('Many volatile sources and strict audit needs','Nhiều nguồn biến động và yêu cầu audit nghiêm ngặt')]

 { k:'code', t:L('Entity-centric data modeling (ECM)','Mô hình hóa dữ liệu entity-centric (ECM)'),
   lead:L('Instead of forcing every question through facts and dimensions, build one wide table per business entity, refreshed as daily snapshots.','Thay vì ép mọi câu hỏi đi qua fact và dimension, dựng một bảng rộng cho mỗi thực thể nghiệp vụ, làm mới dưới dạng snapshot hằng ngày.'),
   blocks:[{lang:'sql', title:'entity_customer_daily.sql (DuckDB syntax)', code:`
create or replace table entity_customer_daily as
select
    c.customer_id,
    current_date                                              as ds,
    c.country,
    c.segment,
    count(o.order_id) filter (where o.ordered_at >= current_date - interval '30 days')  as orders_30d,
    sum(o.amount)     filter (where o.ordered_at >= current_date - interval '30 days')  as revenue_30d,
    max(o.ordered_at)                                         as last_order_at,
    date_diff('day', max(o.ordered_at)::date, current_date)   as days_since_last_order
from dim_customers c
left join fct_orders o using (customer_id)
group by all;`}],
   points:[
    {h:L('What it is','Nó là gì'), p:L('A table whose grain is one row per entity per snapshot date, with attributes and rolling metrics side by side.','Bảng có grain là một dòng cho mỗi thực thể mỗi ngày snapshot, với thuộc tính và metric cuốn chiếu cạnh nhau.')},
    {h:L('Benefits','Lợi ích'), tag:'senior', p:L('Fewer joins for analysts, easy history through snapshots, good fit for features and reverse ETL.','Ít join hơn cho analyst, lịch sử dễ có qua snapshot, hợp với feature và reverse ETL.')},
    {h:L('Trade-offs','Đánh đổi'), p:L('Wide tables, storage per snapshot, and metric definitions must be governed or they diverge.','Bảng rộng, tốn dung lượng cho mỗi snapshot, và định nghĩa metric phải được quản trị nếu không sẽ lệch.')},
    {h:L('Source of the idea','Nguồn gốc ý tưởng'), tag:'senior', p:L('Popularized by Maxime Beauchemin’s writing on entity-centric modeling. Treat it as a pattern to evaluate, not a replacement for dimensional modeling.','Được phổ biến qua bài viết của Maxime Beauchemin về mô hình entity-centric. Hãy coi đây là một mẫu cần đánh giá, không phải thay thế cho mô hình dimensional.')}
   ],
   n:L('Show that this complements the star schema: facts remain the system of record, the entity table is a convenient, derived serving layer.','Cho thấy cách này bổ sung cho star schema: fact vẫn là nguồn ghi nhận, bảng entity là lớp phục vụ dẫn xuất tiện dụng.') },

 { k:'code', t:L('Data assets, software-defined assets and data products','Data asset, software-defined asset và data product'),
   lead:L('A data asset is a dataset with value and an owner. A data product adds a contract, an SLA, documentation and discoverability.','Data asset là dataset có giá trị và có chủ sở hữu. Data product thêm contract, SLA, tài liệu và khả năng tìm thấy.'),
   blocks:[{lang:'yaml', title:'customer_360.data-product.yaml (illustrative)', code:`
data_product:
  name: customer_360

  output_ports:
    - name: customer_daily

   points:[

    {h:L('Software-defined asset','Software-defined asset'), tag:'senior', p:L('Declared in code with its dependencies and checks, so the orchestrator knows what exists and how fresh it is (as in Dagster).','Được khai báo bằng code cùng phụ thuộc và kiểm tra, để orchestrator biết cái gì tồn tại và mới đến đâu (như trong Dagster).')},
    {h:L('Data product','Data product'), tag:'senior', p:L('An asset treated as a product: named owner, output ports, contract, SLA, access rules and lineage.','Một asset được coi như sản phẩm: chủ sở hữu có tên, cổng đầu ra, contract, SLA, quy tắc truy cập và lineage.')},
    {h:L('Data mesh link','Liên hệ với data mesh'), p:L('Data mesh makes domain teams responsible for their data products on a shared platform with federated governance.','Data mesh giao cho các đội domain trách nhiệm với data product của mình trên nền tảng chung với quản trị liên kết.')}
   ],
   n:L('The descriptor format is a sketch. Several open specifications exist for data products and contracts; choose one deliberately.','Định dạng mô tả chỉ là bản phác. Có nhiều đặc tả mở cho data product và contract; hãy chọn một cái có chủ đích.') },

 { k:'code', t:L('Master data management and warehouse automation','Master data management và tự động hóa warehouse'),
   lead:L('MDM builds one trusted record per business entity across systems. Warehouse automation generates repetitive modeling code from metadata.','MDM tạo một bản ghi đáng tin cho mỗi thực thể nghiệp vụ xuyên các hệ thống. Tự động hóa warehouse sinh code mô hình hóa lặp lại từ metadata.'),
   blocks:[{lang:'sql', title:'golden_record.sql (survivorship by source priority)', code:`
with ranked as (
    select
        lower(email) as email_key,
        full_name, phone, source_system, updated_at,
        row_number() over (
            partition by lower(email)
            order by case source_system when 'crm' then 1 when 'billing' then 2 else 3 end,
                     updated_at desc
        ) as rn
    from staging.customer_candidates
)
select email_key as email, full_name, phone
from ranked
where rn = 1;`}],
   points:[
    {h:L('Match and merge','Khớp và gộp'), p:L('Decide when two records are the same entity using exact keys, fuzzy matching or rules, and keep the evidence.','Quyết định khi nào hai bản ghi là cùng một thực thể bằng khóa chính xác, khớp mờ hoặc quy tắc, và giữ lại bằng chứng.')},
    {h:L('Survivorship','Survivorship'), tag:'senior', p:L('Rules that pick the winning value per attribute: source priority, recency or completeness.','Quy tắc chọn giá trị thắng cho từng thuộc tính: ưu tiên nguồn, độ mới hoặc độ đầy đủ.')},
    {h:L('Stewardship','Stewardship'), p:L('People review uncertain matches and own reference data such as country and currency codes.','Con người xem xét các khớp không chắc và sở hữu dữ liệu tham chiếu như mã quốc gia và tiền tệ.')},
    {h:L('Warehouse automation','Tự động hóa warehouse'), tag:'nice', p:L('Metadata-driven generators (commercial tools or dbt packages such as AutomateDV) produce staging, hubs, links and satellites consistently. Review generated code like any other.','Bộ sinh dựa trên metadata (công cụ thương mại hoặc package dbt như AutomateDV) tạo staging, hub, link và satellite nhất quán. Hãy review code sinh ra như mọi code khác.')}
   ],
   n:L('Golden records need a reversible audit trail: which sources fed the winning value, and why.','Golden record cần dấu vết audit đảo ngược được: nguồn nào cho giá trị thắng, và vì sao.') },

 { k:'cards', cols:3, t:L('Data formats, columnar engines and query engines','Định dạng dữ liệu, engine cột và query engine'),

 { k:'code', t:L('Writing, inspecting and reading Parquet','Ghi, kiểm tra và đọc Parquet'),
   lead:L('See the layout for yourself: row groups, statistics and column projection.','Tự nhìn thấy bố cục: row group, thống kê và phép chiếu cột.'),
   blocks:[{lang:'python', title:'parquet_layout.py (pyarrow)', code:`
import pyarrow as pa
import pyarrow.parquet as pq

table = pa.table({
    "user_id": pa.array(range(1_000_000), type=pa.int64()),
    "country": pa.array(["VN", "SG", "US", "DE"] * 250_000),
    "amount": pa.array([float(i % 500) for i in range(1_000_000)]),
}).sort_by("country")                      # sorting makes min/max statistics selective

pq.write_table(table, "events.parquet", compression="zstd", row_group_size=250_000, use_dictionary=True)

pf = pq.ParquetFile("events.parquet")
print(pf.metadata.num_row_groups, pf.schema_arrow)
stats = pf.metadata.row_group(0).column(1).statistics
print(stats.min, stats.max, stats.null_count)          # used to skip row groups

# Read only one column and push a filter down to the reader
only_country = pq.read_table("events.parquet", columns=["amount"], filters=[("country", "=", "VN")])
print(only_country.num_rows)`}],

import duckdb
import pyarrow.dataset as ds
from datafusion import SessionContext

# DuckDB queries an Arrow dataset directly, without copying it into the database
dataset = ds.dataset("lake/events/", format="parquet")
con = duckdb.connect()
con.register("events", dataset)
result = con.sql("select country, count(*) as n from events group by country").arrow()

# DataFusion reads the same files with its own engine

SELECT country, count(*) AS n
FROM read_parquet('events/*.parquet')

GROUP BY country;
-- In the scan operator, look for the filters and the projected columns.

    {lang:'text', title:'push_down_types.txt', code:`
Predicate push-down    filter evaluated in the scan, skipping row groups, partitions or files
Projection push-down   only the referenced columns are read
Aggregate push-down    the source computes count, sum, min, max and returns less data
Limit / top-N          the source stops early
Partition pruning      whole partitions are skipped from the file path or metadata
Dynamic filtering      a join builds a filter from one side and applies it to the scan of the other`}

import duckdb


def build_daily_revenue(con: duckdb.DuckDBPyConnection, ds: str) -> None:
    """Pure with respect to its inputs: the result depends only on the source
    partition for ds, and the target partition is fully replaced."""
    con.execute("delete from marts.daily_revenue where ds = ?", [ds])
    con.execute(
        """
        insert into marts.daily_revenue
        select ?::date as ds, country, sum(amount) as revenue
        from raw.orders
        where order_date = ?::date
        group by country
        """,
        [ds, ds],
    )`},
    {lang:'sql', title:'overwrite_partition.sql', code:`
-- Replace exactly one partition; rerunning produces the same result
INSERT OVERWRITE TABLE marts.daily_revenue PARTITION (ds = '2026-11-09')
SELECT country, SUM(amount) AS revenue
FROM raw.orders
WHERE order_date = DATE '2026-11-09'
GROUP BY country;`}

      var secObj = { name: X('Practice: ', 'Thực hành: ') + tx(g.name), icon: 5 };
      g.slides.forEach(function(sl){
        SLIDES.push({ html: slideHTML(sl, secObj), sec: 50 + gi, color: g.color, group: secObj.name, title: plain(sl.t), kind: sl.k });
      });
    });
    var closeObj = { name: tx('Roadmap and resources'), icon: 5 };
    CLOSING.forEach(function(s){
      SLIDES.push({ html: slideHTML(s, closeObj), sec: CLOSE_SEC, color: CLOSE_COLOR, group: closeObj.name, title: plain(s.t), kind: s.k });
    });
    N = SLIDES.length;
    stage.innerHTML = ''; els = [];
    SLIDES.forEach(function(s, i){
      var el = document.createElement('section');
      el.className = 'slide'; el.setAttribute('data-i', i);
      el.style.setProperty('--accent', s.color);
      el.setAttribute('aria-label', (i + 1) + ' / ' + N + ': ' + s.title);
      el.innerHTML = s.html; translateSvg(el);
      stage.appendChild(el); els.push(el);
    });
    SLIDES.forEach(function(s, i){ if(firstIdx[s.sec] === undefined) firstIdx[s.sec] = i; });
    buildToc(); buildOv(); buildSearch();
  }

  function kindLabel(k){
    return tx({ cards:'Overview / cards', table:'Table', code:'Code', svg:'Diagram', check:'Checklist', pit:'Pitfalls', html:'Components / table', list:'List' }[k] || '');
  }
  function buildToc(){
    var h = '<div class="prog" id="prog"></div>';
    if(bookmarks.length){
      h += '<h3>' + esc(tx('Bookmarks')) + '</h3>';
      bookmarks.forEach(function(i){ if(SLIDES[i]) h += '<a class="bmk" href="#s' + (i + 1) + '" data-go="' + i + '" style="--accent:' + SLIDES[i].color + '"><span>' + esc(SLIDES[i].title) + '</span><span class="num">' + (i + 1) + '</span></a>'; });
    }
    h += '<h3>' + esc(tx('Introduction')) + '</h3>';
    [X('Title', 'Tiêu đề'), X('Agenda', 'Chương trình'), X('Big picture', 'Bức tranh tổng thể')].forEach(function(n, i){
      h += '<a href="#s' + (i + 1) + '" data-go="' + i + '" style="--accent:' + INTRO_COLOR + '"><span>' + esc(n) + '</span><span class="num">' + (i + 1) + '</span></a>';
    });
    h += '<h3>' + esc(tx('The 23 layers')) + '</h3>';
    META.forEach(function(m, i){
      h += '<a href="#s' + (secStart(i) + 1) + '" data-go="' + secStart(i) + '" data-s="' + i + '" style="--accent:' + m.color + '">' + icon(i).replace('<svg ', '<svg class="ico" ') + '<span>' + (i + 1) + '. ' + esc(tx(m.name)) + '</span><span class="num">' + (secStart(i) + 1) + '</span></a>';
    });
    h += '<h3>' + esc(tx('Appendix: how the tools work inside')) + '</h3>';
    ARCH.forEach(function(g, gi){
      var idx = secStart(30 + gi);
      h += '<a href="#s' + (idx + 1) + '" data-go="' + idx + '" data-s="' + (30 + gi) + '" style="--accent:' + g.color + '"><span>' + esc(tx(g.name)) + '</span><span class="num">' + (idx + 1) + '</span></a>';
    });
    h += '<h3>' + esc(tx('Engineering practice: scenarios, incidents, competency, governance')) + '</h3>';
    PRACTICE.forEach(function(g, gi){
      var idx = secStart(50 + gi);
      h += '<a href="#s' + (idx + 1) + '" data-go="' + idx + '" data-s="' + (50 + gi) + '" style="--accent:' + g.color + '"><span>' + esc(tx(g.name)) + '</span><span class="num">' + (idx + 1) + '</span></a>';
    });
    h += '<h3>' + esc(tx('Closing')) + '</h3>';
    var cs = secStart(CLOSE_SEC);
    CLOSING.forEach(function(s, j){
      h += '<a href="#s' + (cs + j + 1) + '" data-go="' + (cs + j) + '" style="--accent:' + CLOSE_COLOR + '"><span>' + esc(plain(s.t)) + '</span><span class="num">' + (cs + j + 1) + '</span></a>';
    });
    toc.innerHTML = h;
  }
  function buildOv(){
    var h = '', last = null;
    SLIDES.forEach(function(s, i){
      if(s.group !== last){ if(last !== null) h += '</div>'; h += '<h3>' + esc(s.group) + '</h3><div class="og">'; last = s.group; }
      h += '<button data-go="' + i + '" style="--c:' + s.color + '"><span class="on">' + (i + 1) + '</span><span class="ot">' + esc(s.title) + '</span><span class="os">' + esc(kindLabel(s.kind)) + '</span></button>';
    });
    ov.innerHTML = h + '</div>';
  }

  function copyCode(btn){
    var text = CODES[parseInt(btn.getAttribute('data-i'), 10)] || '';
    var done = function(){ var o = btn.textContent; btn.textContent = X('Copied', 'Đã chép'); setTimeout(function(){ btn.textContent = o; }, 1400); };
    var fallback = function(){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(err){ btn.textContent = 'Ctrl+C'; }
      document.body.removeChild(ta);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else { fallback(); }
  }

  stage.addEventListener('click', function(e){
    var a = e.target.closest('[data-sec]');
    if(a){ e.preventDefault(); go(secStart(parseInt(a.getAttribute('data-sec'), 10))); return; }
    var c = e.target.closest('.copy'); if(c) copyCode(c);
  });
  toc.addEventListener('click', function(e){
    var a = e.target.closest('a[data-go]'); if(!a) return;
    e.preventDefault(); go(parseInt(a.getAttribute('data-go'), 10));
    if(window.innerWidth < 1200) setToc(false);
  });
  ov.addEventListener('click', function(e){
    var b = e.target.closest('button[data-go]'); if(!b) return;
    go(parseInt(b.getAttribute('data-go'), 10)); setOv(false);
  });

  function go(i, noHash){
    i = Math.max(0, Math.min(N - 1, i));
    if(els[cur]) els[cur].classList.remove('active');
    cur = i;
    var el = els[cur]; el.classList.add('active'); el.scrollTop = 0;
    var s = SLIDES[cur];
    bar.style.width = (N > 1 ? (cur / (N - 1)) * 100 : 100) + '%';
    document.documentElement.style.setProperty('--accent', s.color);
    count.textContent = (cur + 1) + ' / ' + N;
    secname.textContent = s.group;
    document.title = s.title + ' | Modern Data Engineering';
    var links = toc.querySelectorAll('a');
    for(var k = 0; k < links.length; k++){ links[k].classList.toggle('cur', parseInt(links[k].getAttribute('data-go'), 10) === cur); }
    var cc = toc.querySelector('a.cur'); if(cc && body.classList.contains('toc-open')) cc.scrollIntoView({ block:'nearest' });
    var obs = ov.querySelectorAll('button'); for(var q = 0; q < obs.length; q++){ obs[q].classList.toggle('cur', q === cur); }
    if(seen.indexOf(cur) < 0){ seen.push(cur); saveSet('deck-seen', seen); }
    updateProgress(); updateBm();
    document.getElementById('status').textContent = (cur + 1) + ' / ' + N + ': ' + s.title;
    if(!noHash){ try { history.replaceState(null, '', '#s' + (cur + 1)); } catch(err){} }
  }
  function updateProgress(){
    var tot = {}, got = {}, seenSet = {};
    seen.forEach(function(i){ seenSet[i] = 1; });
    SLIDES.forEach(function(s, i){ tot[s.sec] = (tot[s.sec] || 0) + 1; if(seenSet[i]) got[s.sec] = (got[s.sec] || 0) + 1; });
    var links = toc.querySelectorAll('a[data-s]');
    for(var k = 0; k < links.length; k++){
      var sec = links[k].getAttribute('data-s'), n = links[k].querySelector('.num');
      if(n) n.textContent = (got[sec] || 0) + '/' + (tot[sec] || 0);
    }
    var p = document.getElementById('prog');
    var done = 0; for(var key in seenSet){ if(SLIDES[key]) done++; }
    if(p) p.textContent = tx('Progress') + ': ' + done + ' / ' + N;
  }
  function updateBm(){
    var on = bookmarks.indexOf(cur) >= 0, b = document.getElementById('btn-bm');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function toggleBm(){
    var i = bookmarks.indexOf(cur);
    if(i >= 0) bookmarks.splice(i, 1); else bookmarks.push(cur);
    saveSet('deck-bm', bookmarks);
    buildToc(); updateProgress(); updateBm();
    var cc = toc.querySelectorAll('a'); for(var k = 0; k < cc.length; k++){ cc[k].classList.toggle('cur', parseInt(cc[k].getAttribute('data-go'), 10) === cur && !cc[k].classList.contains('bmk')); }
  }
  function buildSearch(){
    rawText = els.map(function(el){ return el.textContent.replace(/\s+/g, ' '); });
    searchIdx = rawText.map(function(t){ return t.toLowerCase(); });
  }
  function setSearch(on){
    body.classList.toggle('search-on', on);
    if(on){ var q = document.getElementById('q'); q.placeholder = tx('Search slides and code'); q.focus(); q.select(); }
  }
  function runSearch(){
    var q = document.getElementById('q').value.trim().toLowerCase(), box = document.getElementById('results');
    if(!q){ box.innerHTML = ''; return; }
    var toks = q.split(/\s+/), out = [];
    for(var i = 0; i < searchIdx.length && out.length < 40; i++){
      var ok = true; for(var t = 0; t < toks.length; t++){ if(searchIdx[i].indexOf(toks[t]) < 0){ ok = false; break; } }
      if(ok) out.push(i);
    }
    if(!out.length){ box.innerHTML = '<p class="note">' + esc(tx('No results')) + '</p>'; return; }
    var re = new RegExp('(' + toks.map(function(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
    box.innerHTML = out.map(function(i){
      var pos = searchIdx[i].indexOf(toks[0]), start = Math.max(0, pos - 50);
      var snip = esc(rawText[i].substr(start, 150)).replace(re, '<mark>$1</mark>');
      return '<button data-go="' + i + '" style="--c:' + SLIDES[i].color + '"><b>' + (i + 1) + '. ' + esc(SLIDES[i].title) + '</b><small>' + esc(SLIDES[i].group) + '</small><small>…' + snip + '…</small></button>';
    }).join('');
  }
  function validate(){
    var saved = LANG;
    function texts(l){ LANG = l; build(); return els.map(function(e){ return e.textContent; }); }
    var en = texts('en'), vi = texts('vi'), titles = SLIDES.map(function(s){ return s.title; });
    var word = /[A-Za-zÀ-ỹ]{4,}/g, untranslated = [], shareSum = 0;
    for(var i = 0; i < en.length; i++){
      var set = {}; (en[i].toLowerCase().match(word) || []).forEach(function(w){ set[w] = 1; });
      var v = vi[i].toLowerCase().match(word) || [], diff = 0;
      v.forEach(function(w){ if(!set[w]) diff++; });
      var share = v.length ? diff / v.length : 1;
      shareSum += share;
      if(share < 0.05) untranslated.push(titles[i]);
    }
    LANG = saved; build(); go(Math.min(cur, N - 1), true);
    var noNotes = els.filter(function(e){ return !e.querySelector('.notes'); }).length;
    return { slides: N, withoutNotes: noNotes, avgTranslatedShare: Math.round(shareSum / en.length * 100) + '%', slidesWithNoTranslation: untranslated.length, withOfficialLinks: els.filter(function(e){ return e.querySelector('.refs'); }).length };
  }
  function setToc(on){ body.classList.toggle('toc-open', on); document.getElementById('btn-toc').setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function setOv(on){
    body.classList.toggle('ov-on', on);
    document.getElementById('btn-ov').setAttribute('aria-pressed', on ? 'true' : 'false');
    if(on){ var c = ov.querySelector('button.cur'); if(c) c.scrollIntoView({ block:'center' }); }
  }
  function setNotes(on){ body.classList.toggle('show-notes', on); document.getElementById('btn-notes').setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function setTheme(t){
    var root = document.documentElement;
    if(t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    try { if(t) localStorage.setItem('deck-theme', t); } catch(err){}
  }
  function isDark(){
    var t = document.documentElement.getAttribute('data-theme');
    if(t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyStatic(){
    var a = document.querySelectorAll('[data-i18n]');
    for(var i = 0; i < a.length; i++) a[i].textContent = tx(a[i].getAttribute('data-i18n'));
    var b = document.querySelectorAll('[data-i18n-title]');
    for(var j = 0; j < b.length; j++){ var t = tx(b[j].getAttribute('data-i18n-title')); b[j].title = t; b[j].setAttribute('aria-label', t); }
    document.getElementById('lang-label').textContent = LANG === 'vi' ? 'VI' : 'EN';
  }
  function setLang(l){
    LANG = l; document.documentElement.lang = (l === 'vi') ? 'vi' : 'en';
    try { localStorage.setItem('deck-lang', l); } catch(err){}
    applyStatic(); build(); go(Math.min(cur, N - 1), true);
  }

  document.getElementById('prev').addEventListener('click', function(){ go(cur - 1); });
  document.getElementById('next').addEventListener('click', function(){ go(cur + 1); });
  document.getElementById('btn-toc').addEventListener('click', function(){ setToc(!body.classList.contains('toc-open')); });
  document.getElementById('scrim').addEventListener('click', function(){ setToc(false); });
  document.getElementById('btn-ov').addEventListener('click', function(){ setOv(!body.classList.contains('ov-on')); });
  document.getElementById('btn-notes').addEventListener('click', function(){ setNotes(!body.classList.contains('show-notes')); });
  document.getElementById('btn-theme').addEventListener('click', function(){ setTheme(isDark() ? 'light' : 'dark'); });
  document.getElementById('btn-search').addEventListener('click', function(){ setSearch(!body.classList.contains('search-on')); });
  document.getElementById('btn-bm').addEventListener('click', toggleBm);
  document.getElementById('q').addEventListener('input', runSearch);
  document.getElementById('results').addEventListener('click', function(e){ var b = e.target.closest('button[data-go]'); if(!b) return; go(parseInt(b.getAttribute('data-go'), 10)); setSearch(false); });
  document.getElementById('btn-lang').addEventListener('click', function(){ setLang(LANG === 'vi' ? 'en' : 'vi'); });
  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '', k0 = e.key;
    if(k0 === 'Escape' && body.classList.contains('search-on')){ setSearch(false); return; }
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(k0 === '/' && tag !== 'INPUT'){ e.preventDefault(); setSearch(true); return; }
    var onBtn = e.target && e.target.closest && e.target.closest('button,a');
    var k = e.key;
    if((k === ' ' || k === 'Enter') && onBtn) return;
    if(k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !e.shiftKey)){ e.preventDefault(); if(body.classList.contains('ov-on')) return; go(cur + 1); }
    else if(k === 'ArrowLeft' || k === 'PageUp' || (k === ' ' && e.shiftKey)){ e.preventDefault(); if(body.classList.contains('ov-on')) return; go(cur - 1); }
    else if(k === 'Home'){ e.preventDefault(); go(0); }
    else if(k === 'End'){ e.preventDefault(); go(N - 1); }
    else if(k === 'o' || k === 'O'){ setOv(!body.classList.contains('ov-on')); }
    else if(k === 'n' || k === 'N'){ setNotes(!body.classList.contains('show-notes')); }
    else if(k === 'm' || k === 'M'){ setToc(!body.classList.contains('toc-open')); }
    else if(k === 't' || k === 'T'){ setTheme(isDark() ? 'light' : 'dark'); }
    else if(k === 'b' || k === 'B'){ toggleBm(); }
    else if(k === 'l' || k === 'L'){ setLang(LANG === 'vi' ? 'en' : 'vi'); }
    else if(k === 'Escape'){ if(body.classList.contains('ov-on')) setOv(false); else if(body.classList.contains('toc-open')) setToc(false); }
  });

  var sx = null, sy = null;
  stage.addEventListener('touchstart', function(e){ if(e.touches.length === 1){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive:true });
  stage.addEventListener('touchend', function(e){
    if(sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8){
      var t = e.target.closest && e.target.closest('.tw,pre,.fig');
      if(t && t.scrollWidth > t.clientWidth) return;
      go(cur + (dx < 0 ? 1 : -1));
    }
  }, { passive:true });
  window.addEventListener('hashchange', function(){ var m = /^#s(\d+)$/.exec(location.hash); if(m) go(parseInt(m[1], 10) - 1, true); });

  // init
  var savedLang = null;
  try { savedLang = localStorage.getItem('deck-lang'); var th = localStorage.getItem('deck-theme'); if(th) setTheme(th); } catch(err){}
  if(!savedLang && navigator.language && /^vi/i.test(navigator.language)) savedLang = 'vi';
  LANG = (savedLang === 'vi') ? 'vi' : 'en';
  document.documentElement.lang = LANG;
  applyStatic(); build();
  if(window.innerWidth >= 1200) setToc(true);
  var m0 = /^#s(\d+)$/.exec(location.hash);
  go(m0 ? parseInt(m0[1], 10) - 1 : 0, true);
  window.__DECK = { get N(){ return N; }, get slides(){ return SLIDES; }, go: go, setLang: setLang, validate: validate };
})();
</script>
</body>
</html>
