layer: 13
slides:
  - id: advanced-analytics-and-ai-from-reporting-to-decisions
    k: cards
    t:
      en: "Advanced analytics and AI: from reporting to decisions"
      vi: "Phân tích nâng cao và AI: từ báo cáo đến quyết định"
    lead:
      en: Seniors are expected to design experiments, reason about causality, and use machine learning and LLMs responsibly.
      vi: Senior được kỳ vọng thiết kế thí nghiệm, suy luận nhân quả và dùng machine learning, LLM một cách có trách nhiệm.
    cols: 3
    cards:
      - h:
          en: Experimentation
          vi: Thử nghiệm
        tag: must
        p:
          en: "A/B tests with sound design: power, randomization, guardrail metrics and pre-defined stopping rules."
          vi: "A/B test với thiết kế đúng đắn: power, randomization, guardrail metric và quy tắc dừng định trước."
      - h:
          en: Causal inference
          vi: Suy luận nhân quả
        tag: senior
        p:
          en: "When you cannot randomize: difference-in-differences, matching, regression discontinuity, synthetic control."
          vi: "Khi không thể randomize: difference-in-differences, matching, regression discontinuity, synthetic control."
      - h:
          en: Core statistics
          vi: Thống kê cốt lõi
        tag: must
        p:
          en: Distributions, confidence intervals, what a p-value does and does not mean, and variance.
          vi: Phân phối, khoảng tin cậy, p-value có và không có nghĩa gì, và phương sai.
      - h:
          en: ML basics and MLOps
          vi: Cơ bản về ML và MLOps
        tag: nice
        p:
          en: scikit-learn models, experiment tracking, feature stores and basic deployment.
          vi: Model scikit-learn, experiment tracking, feature store và deploy cơ bản.
      - h:
          en: LLMs in analytics
          vi: LLM trong analytics
        tag: senior
        p:
          en: Text-to-SQL, copilots and agents grounded in governed definitions, with guardrails.
          vi: Text-to-SQL, copilot và agent dựa trên các định nghĩa được governance, kèm guardrail.
      - h:
          en: Embeddings and vector search
          vi: Embedding và vector search
        tag: nice
        p:
          en: Semantic search over documents and tickets with pgvector or a dedicated vector database.
          vi: Semantic search trên tài liệu và ticket với pgvector hoặc một vector database chuyên dụng.
    n:
      en: This layer is broad on purpose. The expectation for a senior analytics engineer is not to be a research scientist, but to enable good experiments, avoid statistical traps and set safe patterns for AI.
      vi: Lớp này rộng có chủ đích. Kỳ vọng với một senior analytics engineer không phải là trở thành nhà khoa học nghiên cứu, mà là cho phép các thử nghiệm tốt, tránh bẫy thống kê và đặt ra các pattern an toàn cho AI.
