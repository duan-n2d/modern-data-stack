layer: 3
slides:
  - id: warehouse-and-lakehouse-where-the-data-lives
    k: cards
    t:
      en: "Warehouse and lakehouse: where the data lives"
      vi: "Warehouse và lakehouse: nơi dữ liệu cư trú"
    lead:
      en: The storage and compute choice sets your cost curve, your performance ceiling and how hard it is to leave later.
      vi: Lựa chọn storage và compute quyết định đường cong chi phí, trần hiệu năng và độ khó khi rời đi sau này.
    cols: 3
    cards:
      - h: Cloud warehouse
        tag: must
        p:
          en: "Managed SQL engine with its own storage: Snowflake, BigQuery, Redshift. Easiest path to production."
          vi: "SQL engine được quản lý với storage riêng: Snowflake, BigQuery, Redshift. Con đường dễ nhất để lên production."
      - h: Lakehouse
        tag: must
        p:
          en: "Open table formats on object storage, queried by one or more engines: Delta, Iceberg, Hudi."
          vi: "Open table format trên object storage, được truy vấn bởi một hoặc nhiều engine: Delta, Iceberg, Hudi."
      - h:
          en: Storage formats
          vi: Định dạng lưu trữ
        tag: must
        p:
          en: Parquet and ORC are columnar and good for analytics. Avro is row-based and suits streaming and schemas.
          vi: Parquet và ORC lưu theo cột, phù hợp cho analytics. Avro lưu theo dòng, phù hợp cho streaming và schema.
      - h: Real-time OLAP
        tag: nice
        p:
          en: ClickHouse, Druid, Pinot and StarRocks serve low-latency, high-concurrency queries.
          vi: ClickHouse, Druid, Pinot và StarRocks phục vụ query độ trễ thấp, đồng thời cao.
      - h:
          en: Local and embedded
          vi: Local và embedded
        tag: nice
        p:
          en: DuckDB and MotherDuck for small and medium data, prototyping and cheap workloads.
          vi: DuckDB và MotherDuck cho dữ liệu nhỏ và vừa, prototype và workload chi phí thấp.
      - h:
          en: Why it matters
          vi: Vì sao quan trọng
        tag: senior
        p:
          en: Separating storage from compute lets you scale each independently, and open formats reduce lock-in.
          vi: Tách storage khỏi compute cho phép scale từng phần độc lập, và các định dạng mở giúp giảm lock-in.
    n:
      en: Introduce the two big architectural camps and the third category of specialized engines. The unifying idea is separation of storage and compute, and the rise of open table formats that let several engines share one copy of data.
      vi: Giới thiệu hai trường phái kiến trúc lớn và nhóm thứ ba là các engine chuyên biệt. Ý tưởng xuyên suốt là tách storage và compute, cùng sự trỗi dậy của open table format cho phép nhiều engine dùng chung một bản sao dữ liệu.
  - id: tool-landscape-warehouses-and-lakehouse-platforms
    k: table
    t:
      en: "Tool landscape: warehouses and lakehouse platforms"
      vi: "Bức tranh công cụ: warehouse và nền tảng lakehouse"
    head:
      - en: Tool
        vi: Công cụ
      - en: Type
        vi: Loại
      - en: Best for
        vi: Phù hợp nhất
      - en: Strengths
        vi: Điểm mạnh
      - en: Limitations
        vi: Hạn chế
      - en: Pricing model
        vi: Mô hình giá
    rows:
      - - Snowflake
        - en: Cloud data warehouse / platform
          vi: Cloud data warehouse / nền tảng
        - en: Governed SQL analytics with minimal tuning
          vi: SQL analytics có quản trị, ít cần tinh chỉnh
        - en: Separate storage and compute; easy scaling; broad ecosystem
          vi: Tách storage và compute; scale dễ; hệ sinh thái rộng
        - en: Credit costs can surprise; closed engine unless using open tables
          vi: Chi phí credit có thể gây bất ngờ; engine đóng trừ khi dùng open table
        - en: Consumption (credits) plus storage
          vi: Theo mức dùng (credit) cộng storage
      - - BigQuery
        - Serverless warehouse
        - en: Spiky workloads; GCP-centric stacks
          vi: Workload đột biến; stack xoay quanh GCP
        - en: No cluster management; strong for large scans
          vi: Không cần quản lý cluster; mạnh với scan lớn
        - en: Cost model needs care (bytes scanned or reserved capacity)
          vi: Mô hình chi phí cần cẩn trọng (bytes scanned hoặc capacity đặt trước)
        - en: On-demand per bytes processed, or capacity-based
          vi: On-demand theo bytes xử lý, hoặc theo capacity
      - - Amazon Redshift
        - en: Warehouse (provisioned and serverless)
          vi: Warehouse (provisioned và serverless)
        - en: AWS-centric stacks with tight AWS integration
          vi: Stack xoay quanh AWS, tích hợp chặt với AWS
        - en: Deep AWS integration; mature
          vi: Tích hợp sâu với AWS; trưởng thành
        - en: More tuning than serverless peers on provisioned clusters
          vi: Cần tinh chỉnh nhiều hơn các đối thủ serverless trên cluster provisioned
        - en: Instance-hours or serverless compute units
          vi: Theo giờ instance hoặc serverless compute unit
      - - Databricks
        - en: Lakehouse platform
          vi: Nền tảng lakehouse
        - en: Mixed SQL, ML and streaming on one platform
          vi: SQL, ML và streaming trên cùng một nền tảng
        - en: Delta Lake, Unity Catalog, Spark and SQL warehouses
          vi: Delta Lake, Unity Catalog, Spark và SQL warehouse
        - en: Learning curve; costs need governance
          vi: Đường cong học tập; chi phí cần quản trị
        - en: Consumption (DBUs) plus cloud infrastructure
          vi: Theo mức dùng (DBU) cộng hạ tầng cloud
      - - Synapse / Fabric
        - en: Microsoft analytics platform
          vi: Nền tảng analytics của Microsoft
        - en: Microsoft-centric organizations (Power BI, Azure)
          vi: Tổ chức dùng nhiều Microsoft (Power BI, Azure)
        - en: Tight Power BI and OneLake integration
          vi: Tích hợp chặt với Power BI và OneLake
        - en: Product direction has been shifting toward Fabric; check roadmap
          vi: Định hướng sản phẩm đang dịch chuyển sang Fabric; cần xem roadmap
        - en: Capacity-based
          vi: Theo capacity
      - - MotherDuck / DuckDB
        - en: Embedded and serverless DuckDB
          vi: DuckDB embedded và serverless
        - en: Small to medium data; cheap analytics; local dev
          vi: Dữ liệu nhỏ đến vừa; analytics chi phí thấp; dev local
        - en: Very fast on a single node; simple
          vi: Rất nhanh trên một node; đơn giản
        - en: Not built for very large scale or heavy concurrent writes
          vi: Không dành cho quy mô rất lớn hoặc nhiều ghi đồng thời nặng
        - en: DuckDB is open source; MotherDuck is usage/plan-based
          vi: DuckDB là mã nguồn mở; MotherDuck tính theo mức dùng/gói
    cap:
      en: "Pricing models differ in kind, not just in level: compare cost per realistic workload, not list prices."
      vi: "Mô hình giá khác nhau về bản chất, không chỉ về mức giá: hãy so sánh chi phí theo workload thực tế, không phải bảng giá niêm yết."
    n:
      en: "Resist ranking these. Each fits a context: BigQuery for serverless GCP, Snowflake for governed multi-cloud SQL, Databricks for mixed ML and SQL, Fabric for Microsoft shops, DuckDB for small and local."
      vi: "Đừng xếp hạng các nền tảng này. Mỗi nền tảng hợp một ngữ cảnh: BigQuery cho GCP serverless, Snowflake cho SQL multi-cloud có quản trị, Databricks cho ML và SQL kết hợp, Fabric cho hệ Microsoft, DuckDB cho quy mô nhỏ và local."
  - id: tool-landscape-table-formats-and-real-time-olap
    k: table
    t:
      en: "Tool landscape: table formats and real-time OLAP"
      vi: "Bức tranh công cụ: table format và OLAP thời gian thực"
    head:
      - en: Tool
        vi: Công cụ
      - en: Type
        vi: Loại
      - en: Best for
        vi: Phù hợp nhất
      - en: Strengths
        vi: Điểm mạnh
      - en: Limitations
        vi: Hạn chế
      - en: Pricing model
        vi: Mô hình giá
    rows:
      - - Delta Lake
        - Open table format
        - en: Lakehouse on Spark and Databricks
          vi: Lakehouse trên Spark và Databricks
        - en: ACID transactions, time travel, mature tooling
          vi: ACID transaction, time travel, tooling trưởng thành
        - en: Best experience in the Databricks ecosystem
          vi: Trải nghiệm tốt nhất trong hệ sinh thái Databricks
        - en: Open source
          vi: Mã nguồn mở
      - - Apache Iceberg
        - Open table format
        - en: Multi-engine lakehouse and avoiding lock-in
          vi: Lakehouse đa engine và tránh lock-in
        - en: Broad engine support; hidden partitioning; schema evolution
          vi: Hỗ trợ nhiều engine; hidden partitioning; schema evolution
        - en: Catalog and maintenance choices add complexity
          vi: Lựa chọn catalog và bảo trì làm tăng độ phức tạp
        - en: Open source
          vi: Mã nguồn mở
      - - Apache Hudi
        - Open table format
        - en: Upserts and incremental pulls on a lake
          vi: Upsert và incremental pull trên lake
        - en: Strong record-level updates and streaming ingestion
          vi: Cập nhật mức record và streaming ingestion mạnh
        - en: Smaller community than Delta and Iceberg
          vi: Cộng đồng nhỏ hơn Delta và Iceberg
        - en: Open source
          vi: Mã nguồn mở
      - - ClickHouse
        - en: Columnar OLAP database
          vi: Cơ sở dữ liệu OLAP dạng cột
        - en: Fast aggregations on event and log data
          vi: Aggregation nhanh trên dữ liệu event và log
        - en: Very fast scans; high compression
          vi: Scan rất nhanh; nén cao
        - en: Joins and updates need design care; different mental model
          vi: Join và update cần thiết kế cẩn thận; tư duy khác
        - en: Open source plus managed cloud
          vi: Mã nguồn mở cộng managed cloud
      - - Druid / Pinot
        - Real-time OLAP
        - en: User-facing analytics with low latency and high concurrency
          vi: Analytics hướng người dùng với độ trễ thấp và concurrency cao
        - en: Sub-second queries on streaming data
          vi: Query dưới một giây trên dữ liệu streaming
        - en: Operationally heavier; narrower SQL support
          vi: Vận hành nặng hơn; hỗ trợ SQL hẹp hơn
        - en: Open source plus managed offerings
          vi: Mã nguồn mở cộng các gói managed
      - - StarRocks
        - en: MPP OLAP database
          vi: Cơ sở dữ liệu MPP OLAP
        - en: Fast SQL on lakehouse data and real-time workloads
          vi: SQL nhanh trên dữ liệu lakehouse và workload real-time
        - en: Vectorized engine; can query Iceberg and Delta tables
          vi: Engine vectorized; có thể query bảng Iceberg và Delta
        - en: Younger ecosystem
          vi: Hệ sinh thái còn non trẻ
        - en: Open source plus managed offerings
          vi: Mã nguồn mở cộng các gói managed
    cap:
      en: "Storage formats: Parquet and ORC (columnar, analytics), Avro (row-based, streaming). Object stores: S3, GCS, ADLS."
      vi: "Định dạng lưu trữ: Parquet và ORC (theo cột, analytics), Avro (theo dòng, streaming). Object store: S3, GCS, ADLS."
    n:
      en: "Table formats are metadata layers on top of Parquet files. They add transactions, schema evolution and time travel. The real-time OLAP engines solve a different problem: serving many fast queries to applications and customers."
      vi: "Table format là các lớp metadata nằm trên file Parquet. Chúng bổ sung transaction, schema evolution và time travel. Các engine real-time OLAP giải quyết bài toán khác: phục vụ nhiều query nhanh cho ứng dụng và khách hàng."
