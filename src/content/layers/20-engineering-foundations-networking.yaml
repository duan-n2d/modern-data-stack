layer: 20
slides:
  - id: engineering-foundations-what-every-tool-sits-on
    k: cards
    t:
      en: "Engineering foundations: what every tool sits on"
      vi: "Nền tảng kỹ thuật: thứ mà mọi công cụ đứng trên"
    lead:
      en: "Kafka, Spark and Airflow all fail in the same few places: the network, the operating system, the release process and the database transaction. If you cannot diagnose those, you cannot diagnose the tools."
      vi: "Kafka, Spark và Airflow đều hỏng ở cùng vài chỗ: mạng, hệ điều hành, quy trình phát hành và transaction của database. Nếu không chẩn đoán được những thứ đã thì không chẩn đoán được công cụ."
    cols: 3
    cards:
      - h:
          en: Networking
          vi: Mạng
        tag: must
        p:
          en: DNS, TCP, TLS, HTTP, proxies, load balancers and connection pooling. Most “the job hangs” incidents are network incidents.
          vi: DNS, TCP, TLS, HTTP, proxy, load balancer và connection pooling. Phần lớn sự cố “job bị treo” là sự cố mạng.
      - h:
          en: Linux and the OS
          vi: Linux và hệ điều hành
        tag: must
        p:
          en: Processes, threads, memory, file descriptors, disk I/O and signals explain OOM kills, “too many open files” and slow disks.
          vi: Process, thread, bộ nhớ, file descriptor, I/O đĩa và signal giải thích OOM kill, “too many open files” và đĩa chậm.
      - h:
          en: Git and CI/CD
          vi: Git và CI/CD
        tag: must
        p:
          en: Branching, review, test strategy, release management and rollback turn changes into safe, reversible events.
          vi: Branching, review, chiến lược test, quản lý phát hành và rollback biến thay đổi thành sự kiện an toàn, hoàn tác được.
      - h:
          en: Transactions and isolation
          vi: Transaction và isolation
        tag: must
        p:
          en: What concurrent readers and writers see. Explains lost updates, duplicate keys and inconsistent reports.
          vi: Reader và writer đồng thời thấy gì. Giải thích lost update, trùng khóa và báo cáo không nhất quán.
      - h:
          en: Indexing and plans
          vi: Index và plan
        tag: senior
        p:
          en: How a database finds rows, and how to read an execution plan to know why it was slow.
          vi: Database tìm dòng thế nào, và cách đọc execution plan để biết vì sao nó chậm.
      - h:
          en: Observe, then fix
          vi: Quan sát rồi mới sửa
        tag: senior
        p:
          en: For each concept learn what happens inside, why, how to observe it and how to fix it.
          vi: Với mỗi khái niệm, học điều gì xảy ra bên trong, vì sao, cách quan sát và cách sửa.
    n:
      en: This layer is deliberately tool-free. Each slide pairs a concept with the command that makes it visible.
      vi: Layer này cố ý không gắn với công cụ. Mỗi slide ghép một khái niệm với lệnh làm nó hiện ra.
  - id: networking-you-must-be-able-to-diagnose
    k: table
    t:
      en: Networking you must be able to diagnose
      vi: Mạng bạn phải chẩn đoán được
    head:
      - en: Concept
        vi: Khái niệm
      - en: What goes wrong in a data platform
        vi: Chuyện gì sai trong data platform
      - en: Observe
        vi: Quan sát
      - en: Typical fix
        vi: Cách sửa điển hình
    rows:
      - - DNS
        - en: Name resolves to a public IP instead of a private endpoint, or a stale cached record
          vi: Tên phân giải ra IP công khai thay vì private endpoint, hoặc bản ghi cache cũ
        - "`dig host`, `nslookup host`"
        - en: Fix the private DNS zone and TTLs; clear caches
          vi: Sửa private DNS zone và TTL; xóa cache
      - - TCP
        - en: Connection timeouts, resets, or exhausted ports
          vi: Timeout kết nối, bị reset, hoặc cạn port
        - "`nc -zv host 5432`, `ss -tan`"
        - en: Check security groups and routes; tune keepalive and timeouts
          vi: Kiểm tra security group và route; chỉnh keepalive và timeout
      - - TLS
        - en: Certificate expired, wrong hostname, missing CA, handshake failures
          vi: Chứng chỉ hết hạn, sai hostname, thiếu CA, lỗi handshake
        - "`openssl s_client -connect host:443 -servername host`"
        - en: Renew or fix the chain; trust the right CA
          vi: Gia hạn hoặc sửa chuỗi; tin đúng CA
      - - HTTP
        - en: 429 rate limits, 5xx, slow responses, redirects
          vi: Giới hạn 429, 5xx, phản hồi chậm, redirect
        - "`curl -v https://api.example.com/health`"
        - en: Backoff with jitter, pagination, timeouts
          vi: Backoff có jitter, phân trang, timeout
      - - en: Proxy and firewall
          vi: Proxy và firewall
        - en: Egress blocked; only some hosts reachable
          vi: Egress bị chặn; chỉ vài host truy cập được
        - "`traceroute host`, `curl -v --proxy`"
        - en: Allow-list required endpoints; configure proxy variables
          vi: Cho phép các endpoint cần thiết; cấu hình biến proxy
      - - en: Load balancing and pooling
          vi: Load balancing và pooling
        - en: Idle connections dropped by the balancer; “too many connections” on the database
          vi: Kết nối rảnh bị load balancer cắt; “too many connections” trên database
        - en: Database connection count; balancer idle timeout
          vi: Số kết nối database; idle timeout của load balancer
        - en: Connection pooler, keepalives shorter than the idle timeout
          vi: Connection pooler, keepalive ngắn hơn idle timeout
    cap:
      en: "When something “hangs”, test layer by layer: name, route, port, TLS, then the application protocol."
      vi: "Khi thứ gì đã “treo”, hãy kiểm tra từng tầng: tên, đường đi, cổng, TLS, rồi giao thức ứng dụng."
    n:
      en: "Teach the layered method: DNS, then TCP, then TLS, then HTTP. It localizes most problems in minutes."
      vi: "Dạy phương pháp theo tầng: DNS, rồi TCP, rồi TLS, rồi HTTP. Nó khoanh vùng hầu hết vấn đề trong vài phút."
  - id: linux-and-os-resources-behind-data-tool-failures
    k: table
    t:
      en: Linux and OS resources behind data-tool failures
      vi: Tài nguyên Linux và OS đứng sau lỗi công cụ dữ liệu
    head:
      - en: Resource
        vi: Tài nguyên
      - en: Failure you see
        vi: Lỗi bạn thấy
      - en: Observe
        vi: Quan sát
      - en: Fix
        vi: Cách sửa
    rows:
      - - en: Memory
          vi: Bộ nhớ
        - en: Process killed with no error; container OOMKilled
          vi: Process bị giết không có lỗi; container OOMKilled
        - "`free -m`, `dmesg | grep -i oom`"
        - en: Right-size memory; reduce data per task; fix leaks
          vi: Chọn lại cỡ bộ nhớ; giảm dữ liệu mỗi task; sửa rò rỉ
      - - CPU
        - en: High load, throttling in containers
          vi: Tải cao, bị throttle trong container
        - "`top`, `pidstat 1`"
        - en: Profile; raise limits; scale out
          vi: Profile; tăng giới hạn; mở rộng ngang
      - - en: Disk I/O
          vi: I/O đĩa
        - en: Slow writes, high iowait, spill slowness
          vi: Ghi chậm, iowait cao, spill chậm
        - "`iostat -x 1`"
        - en: Faster volumes; fewer small writes; separate spill disks
          vi: Volume nhanh hơn; ít ghi nhỏ hơn; đĩa spill riêng
      - - en: Disk space and inodes
          vi: Dung lượng đĩa và inode
        - en: “No space left on device” while df shows free space
          vi: “No space left on device” dù df báo còn chỗ
        - "`df -h`, `df -i`"
        - en: Clean temp and logs; fix retention; lower file counts
          vi: Dọn tạm và log; sửa retention; giảm số file
      - - en: File descriptors
          vi: File descriptor
        - “Too many open files”
        - "`ulimit -n`, `lsof -p <pid> | wc -l`"
        - en: Raise limits; close handles; reduce connections
          vi: Tăng giới hạn; đúng handle; giảm kết nối
      - - en: Signals and shutdown
          vi: Signal và tắt máy
        - en: Jobs lose work when a container stops
          vi: Job mất việc khi container dừng
        - "`docker stop`, `kill -TERM`"
        - en: "Handle SIGTERM: finish or checkpoint, then exit"
          vi: "Xử lý SIGTERM: hoàn tất hoặc checkpoint rồi thoát"
    cap:
      en: "`strace -p <pid>` and `/proc/<pid>/` show what a stuck process is actually doing."
      vi: "`strace -p <pid>` và `/proc/<pid>/` cho thấy process bị kẹt đang thật sự làm gì."
    n:
      en: "Connect each row to a tool: Spark executors die from memory, Kafka brokers from disk and file descriptors, Airflow workers from SIGTERM handling."
      vi: "Nối mỗi hàng với một công cụ: executor Spark chết vì bộ nhớ, broker Kafka vì đĩa và file descriptor, worker Airflow vì xử lý SIGTERM."
  - id: git-and-ci-cd-safe-changes-and-fast-rollback
    k: code
    t:
      en: "Git and CI/CD: safe changes and fast rollback"
      vi: "Git và CI/CD: thay đổi an toàn và rollback nhanh"
    lead:
      en: Every production change should be small, reviewed, tested and reversible.
      vi: Mọi thay đổi production nên nhỏ, được review, được test và hoàn tác được.
    blocks:
      - lang: bash
        title: rollback_and_bisect.sh
        code: |-
          # Undo a merged pull request with a new commit (history stays intact)
          git revert -m 1 <merge_commit_sha>

          # Find the commit that introduced a bug
          git bisect start
          git bisect bad HEAD
          git bisect good v2026.10.1
          # run your test at each step, then mark: git bisect good | git bisect bad
          git bisect reset

          # Tag a release so a deploy is reproducible
          git tag -a v2026.11.0 -m "Release 2026.11.0"
          git push origin v2026.11.0
    points:
      - h:
          en: Trunk-based, small PRs
          vi: Trunk-based, PR nhỏ
        p:
          en: Merge small changes often behind tests. Long-lived branches turn into risky releases.
          vi: Merge thay đổi nhỏ thường xuyên sau các test. Nhánh sống lâu biến thành bản phát hành rủi ro.
      - h:
          en: Test pyramid
          vi: Kim tự tháp test
        tag: senior
        p:
          en: Many fast unit tests, fewer integration tests, a few end-to-end checks, plus data tests in the pipeline.
          vi: Nhiều unit test nhanh, ít integration test hơn, vài kiểm tra end-to-end, cộng test dữ liệu trong pipeline.
      - h:
          en: Release management
          vi: Quản lý phát hành
        p:
          en: Tag releases, keep a changelog, and promote the same artifact from staging to production.
          vi: Gắn tag phát hành, giữ changelog và đưa cùng một artifact từ staging lên production.
      - h:
          en: Rollback options
          vi: Các cách rollback
        tag: senior
        p:
          en: "Code: `git revert`. Data: time travel, snapshots or a schema swap. Behaviour: feature flags. Know which one applies before you deploy."
          vi: "Code: `git revert`. Dữ liệu: time travel, snapshot hoặc hoán đổi schema. Hành vi: feature flag. Biết cái nào áp dụng trước khi deploy."
    n:
      en: Rolling back code does not roll back data. Pair every deployment that changes data with a data-level rollback plan.
      vi: Rollback code không rollback dữ liệu. Với mỗi lần deploy làm đổi dữ liệu, hãy kèm kế hoạch rollback ở mức dữ liệu.
  - id: transactions-isolation-levels-and-indexes
    k: stack
    t:
      en: Transactions, isolation levels and indexes
      vi: Transaction, isolation level và index
    lead:
      en: Isolation decides what concurrent work can see. Indexes decide how fast a row is found.
      vi: Isolation quyết định công việc đồng thời thấy gì. Index quyết định tìm một dòng nhanh đến đâu.
    parts:
      - table:
          head:
            - en: Isolation level
              vi: Mức isolation
            - en: Prevents
              vi: Ngăn chặn
            - en: Still allows
              vi: Vẫn cho phép
            - en: Notes
              vi: Ghi chú
          rows:
            - - READ COMMITTED
              - en: Dirty reads
                vi: Dirty read
              - en: Non-repeatable reads, phantoms, lost updates
                vi: Non-repeatable read, phantom, lost update
              - en: Common default in PostgreSQL
                vi: Mặc định phổ biến trong PostgreSQL
            - - REPEATABLE READ / SNAPSHOT
              - en: Dirty and non-repeatable reads; usually phantoms
                vi: Dirty read và non-repeatable read; thường cả phantom
              - en: Write skew in some systems
                vi: Write skew ở một số hệ thống
              - en: Each transaction sees a consistent snapshot
                vi: Mỗi transaction thấy một snapshot nhất quán
            - - SERIALIZABLE
              - en: All of the above anomalies
                vi: Mọi bất thường trên
              - en: Transactions may abort and need retry
                vi: Transaction có thể bị hủy và cần retry
              - en: Strongest and costliest
                vi: Mạnh nhất và tốn nhất
      - note:
          en: Warehouses usually offer snapshot-style isolation inside the service; check your platform’s documentation for exact guarantees.
          vi: Warehouse thường cung cấp isolation kiểu snapshot trong dịch vụ; hãy xem tài liệu nền tảng của bạn để biết bảo đảm chính xác.
      - code:
          lang: sql
          title: transactions_and_indexes.sql (PostgreSQL)
          code: |-
            -- Prevent a lost update by locking the row you will change
            BEGIN;
            SELECT balance FROM accounts WHERE id = 1 FOR UPDATE;
            UPDATE accounts SET balance = balance - 100 WHERE id = 1;
            COMMIT;

            -- Add an index without blocking writes, then confirm the plan uses it
            CREATE INDEX CONCURRENTLY idx_orders_customer ON orders (customer_id);
            EXPLAIN (ANALYZE, BUFFERS)
            SELECT * FROM orders WHERE customer_id = 42;
    n:
      en: "Tie this to data work: concurrent loads into the same table, a report running during a load, and CDC consumers all depend on these rules. Indexes help point lookups; analytical engines rely on partition pruning and column statistics instead."
      vi: "Gắn với công việc dữ liệu: các lần load đồng thời vào cùng một bảng, báo cáo chạy trong lúc load và consumer CDC đều phụ thuộc các quy tắc này. Index giúp tra cứu điểm; engine phân tích dựa vào partition pruning và thống kê cột."
  - id: system-architecture-principles-for-a-lakehouse
    k: table
    t:
      en: "System architecture: principles and how they shape a lakehouse"
      vi: "Kiến trúc hệ thống: các nguyên tắc và cách chúng định hình lakehouse"
    lead:
      en: System architecture is the high-level design of a system — its components, what each is responsible for, the interfaces between them, and the quality goals that drove those choices. Every principle is a trade-off, not a free win.
      vi: Kiến trúc hệ thống là thiết kế ở mức cao của một hệ thống — các thành phần, trách nhiệm của từng phần, giao diện giữa chúng, và các mục tiêu chất lượng dẫn đến những lựa chọn đó. Mỗi nguyên tắc là một sự đánh đổi, không phải lợi ích miễn phí.
    head:
      - en: Principle
        vi: Nguyên tắc
      - en: What it means
        vi: Ý nghĩa
      - en: In a lakehouse
        vi: Trong lakehouse
      - en: Trade-off
        vi: Đánh đổi
    rows:
      - - en: Separation of concerns
          vi: Tách biệt trách nhiệm
        - en: Each component does one job behind a clear boundary
          vi: Mỗi thành phần làm một việc sau một ranh giới rõ ràng
        - en: Ingestion, object storage, table format, catalog, compute engines and the semantic layer are separate layers
          vi: Ingestion, object storage, table format, catalog, compute engine và semantic layer là các lớp riêng
        - en: More moving parts to integrate and operate
          vi: Nhiều thành phần hơn để tích hợp và vận hành
      - - en: Loose coupling through contracts
          vi: Kết nối lỏng qua hợp đồng
        - en: Components depend on stable interfaces, not on each other's internals
          vi: Thành phần phụ thuộc vào giao diện ổn định, không vào nội bộ của nhau
        - en: Open table formats (Iceberg, Delta), the Iceberg REST catalog spec and data contracts let engines change independently
          vi: Open table format (Iceberg, Delta), đặc tả REST catalog của Iceberg và data contract cho phép engine thay đổi độc lập
        - en: Standards move slower than proprietary features
          vi: Chuẩn mở tiến chậm hơn tính năng độc quyền
      - - en: Independent scaling
          vi: Scale độc lập
        - en: Scale the part under load, not the whole system
          vi: Scale phần đang chịu tải, không phải toàn hệ thống
        - en: Storage grows cheaply; compute clusters scale up and down per workload
          vi: Storage tăng rẻ; cluster compute scale lên xuống theo từng workload
        - en: Network reads from object storage are slower than local disk, so caching matters
          vi: Đọc qua mạng từ object storage chậm hơn đĩa cục bộ, nên cache rất quan trọng
      - - en: Failure isolation
          vi: Cô lập lỗi
        - en: A fault in one part should not take down the rest
          vi: Lỗi ở một phần không được kéo sập phần còn lại
        - en: Separate compute per workload; atomic commits keep readers on the last good snapshot
          vi: Compute riêng cho từng workload; commit nguyên tử giữ người đọc ở snapshot tốt gần nhất
        - en: Duplicated capacity costs money
          vi: Năng lực dư thừa tốn tiền
      - - en: Observability and security by design
          vi: Quan sát được và bảo mật ngay từ thiết kế
        - en: Logs, metrics, lineage and access control are built in, not bolted on
          vi: Log, metric, lineage và kiểm soát truy cập được tích hợp sẵn, không gắn thêm sau
        - en: Catalog-level permissions, audit logs, table health metrics and lineage
          vi: Phân quyền ở mức catalog, audit log, metric sức khỏe bảng và lineage
        - en: Up-front effort before the first dashboard ships
          vi: Tốn công từ đầu trước khi dashboard đầu tiên ra mắt
      - - en: Evolvability
          vi: Khả năng tiến hóa
        - en: Prefer reversible decisions and record the irreversible ones
          vi: Ưu tiên quyết định đảo ngược được và ghi lại những quyết định không đảo ngược được
        - en: Schema and partition evolution without rewrites; ADRs for engine and catalog choices
          vi: Tiến hóa schema và partition không cần ghi lại dữ liệu; ADR cho lựa chọn engine và catalog
        - en: Flexibility can become an excuse never to decide
          vi: Sự linh hoạt có thể thành cái cớ để không bao giờ quyết định
    cap:
      en: Start from quality goals (latency, freshness, cost, compliance), then choose components. Architecture chosen from a tool list rarely meets the goals.
      vi: Bắt đầu từ mục tiêu chất lượng (độ trễ, độ mới, chi phí, tuân thủ), rồi mới chọn thành phần. Kiến trúc chọn từ danh sách công cụ hiếm khi đạt mục tiêu.
    n:
      en: Ask the audience to name, for their own platform, which principle they gave up and why. Good architecture is explicit about what it sacrificed.
      vi: Hãy yêu cầu khán giả nêu, với nền tảng của chính họ, nguyên tắc nào đã bị hy sinh và vì sao. Kiến trúc tốt nói rõ nó đã hy sinh điều gì.
  - id: monolith-versus-microservices
    k: table
    t:
      en: Monolithic architecture versus microservices
      vi: Kiến trúc nguyên khối so với microservices
    lead:
      en: A monolith builds and deploys the whole application as one unit. Microservices split it into small services that deploy, scale and fail independently, each owning its own data. The choice changes what the data team has to ingest.
      vi: Monolith build và deploy toàn bộ ứng dụng như một khối. Microservices tách nó thành các dịch vụ nhỏ deploy, scale và hỏng độc lập, mỗi dịch vụ sở hữu dữ liệu riêng. Lựa chọn này thay đổi những gì đội dữ liệu phải ingest.
    head:
      - en: Dimension
        vi: Khía cạnh
      - Monolith
      - Microservices
    rows:
      - - en: Deployment
          vi: Triển khai
        - en: One artifact; every change ships the whole app
          vi: Một artifact; mọi thay đổi phát hành cả ứng dụng
        - en: Each service ships on its own schedule
          vi: Mỗi dịch vụ phát hành theo lịch riêng
      - - en: Data
          vi: Dữ liệu
        - en: One shared database; joins and transactions are easy
          vi: Một database dùng chung; join và transaction dễ dàng
        - en: Database per service; cross-service queries need APIs or events
          vi: Database riêng cho từng dịch vụ; truy vấn liên dịch vụ cần API hoặc sự kiện
      - - en: Scaling
          vi: Scale
        - en: Scale the whole app, even if one module is hot
          vi: Scale cả ứng dụng, kể cả khi chỉ một module nóng
        - en: Scale only the busy service
          vi: Chỉ scale dịch vụ đang bận
      - - en: Consistency
          vi: Nhất quán
        - en: ACID transactions across modules
          vi: Transaction ACID xuyên các module
        - en: Eventual consistency, sagas and compensating actions
          vi: Nhất quán cuối cùng, saga và hành động bù trừ
      - - en: Operations
          vi: Vận hành
        - en: Simple to run, debug and test locally
          vi: Đơn giản để chạy, debug và test cục bộ
        - en: Needs service discovery, tracing, gateways and mature CI/CD
          vi: Cần service discovery, tracing, gateway và CI/CD trưởng thành
      - - en: Team fit
          vi: Phù hợp đội nhóm
        - en: Small teams and early products
          vi: Đội nhỏ và sản phẩm giai đoạn đầu
        - en: Many teams that need to move independently
          vi: Nhiều đội cần làm việc độc lập
      - - en: Impact on the data platform
          vi: Ảnh hưởng tới nền tảng dữ liệu
        - en: One source to replicate; the schema is the whole business
          vi: Một nguồn để replicate; schema chính là toàn bộ nghiệp vụ
        - en: Dozens of sources and schemas; the lakehouse becomes the only place where cross-service joins happen
          vi: Hàng chục nguồn và schema; lakehouse trở thành nơi duy nhất thực hiện join liên dịch vụ
    cap:
      en: A modular monolith — one deployable with strict internal boundaries — is often the right middle step. Split a service out when a team or a scaling need demands it.
      vi: Modular monolith — một khối deploy với ranh giới nội bộ chặt — thường là bước trung gian đúng đắn. Tách dịch vụ khi một đội hoặc nhu cầu scale thật sự đòi hỏi.
    n:
      en: "Microservices solve an organizational problem (many teams) at the cost of a distributed-systems problem. For data engineers the main consequence is more sources, more schema drift, and the need for events or CDC per service."
      vi: "Microservices giải quyết một bài toán tổ chức (nhiều đội) bằng cái giá của bài toán hệ phân tán. Với data engineer, hệ quả chính là nhiều nguồn hơn, schema thay đổi nhiều hơn, và cần sự kiện hoặc CDC cho từng dịch vụ."
  - id: microservice-data-into-the-lakehouse-cdc-and-outbox
    k: code
    t:
      en: "Microservice data in a lakehouse: CDC, outbox events and Iceberg"
      vi: "Dữ liệu microservice trong lakehouse: CDC, outbox event và Iceberg"
    lead:
      en: Writing to the database and then publishing to Kafka is a dual write; if the second step fails the two disagree. The outbox pattern writes the event in the same transaction, and CDC ships it to Kafka and on to Iceberg.
      vi: Ghi vào database rồi mới publish lên Kafka là dual write; nếu bước hai lỗi thì hai nơi lệch nhau. Mẫu outbox ghi sự kiện trong cùng transaction, và CDC chuyển nó lên Kafka rồi vào Iceberg.
    blocks:
      - lang: sql
        title: orders_service_outbox.sql (PostgreSQL)
        code: |-
          -- One local transaction: the state change and its event commit together
          begin;
          update orders set status = 'SHIPPED' where order_id = 42;
          insert into outbox (id, aggregatetype, aggregateid, type, payload)
          values (gen_random_uuid(), 'order', '42', 'OrderShipped',
                  '{"order_id": 42, "status": "SHIPPED"}'::jsonb);
          commit;
      - lang: json
        title: debezium-outbox-connector.json (excerpt)
        code: |-
          {
            "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
            "database.hostname": "orders-db",
            "database.dbname": "orders",
            "topic.prefix": "orders",
            "table.include.list": "public.outbox",
            "transforms": "outbox",
            "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter"
          }
      - lang: sql
        title: merge_into_iceberg.sql (Spark SQL)
        code: |-
          -- Bronze keeps every event; silver keeps the latest state per order
          merge into lake.silver.orders t
          using (
            select * from (
              select *, row_number() over (partition by order_id order by event_seq desc) as rn
              from lake.bronze.order_events
              where ingest_date = current_date()
            ) where rn = 1
          ) s
          on t.order_id = s.order_id
          when matched and s.event_seq > t.event_seq then update set *
          when not matched then insert *;
    points:
      - h:
          en: Raw CDC versus outbox
          vi: CDC thô so với outbox
        tag: senior
        p:
          en: CDC on business tables exposes each service's internal schema. An outbox publishes a deliberate event contract the service team owns.
          vi: CDC trên bảng nghiệp vụ phơi bày schema nội bộ của dịch vụ. Outbox công bố một hợp đồng sự kiện có chủ đích do đội dịch vụ sở hữu.
      - h:
          en: Ordering
          vi: Thứ tự
        tag: senior
        p:
          en: Key Kafka messages by aggregate id so all events for one order land in one partition, and keep a sequence number for the merge.
          vi: Đặt khóa message Kafka theo aggregate id để mọi sự kiện của một đơn nằm chung partition, và giữ số thứ tự cho bước merge.
      - h:
          en: Idempotency
          vi: Idempotency
        tag: must
        p:
          en: CDC is at-least-once. Deduplicate by event id in bronze and guard updates with the sequence check shown above.
          vi: CDC là at-least-once. Chống trùng theo event id ở bronze và bảo vệ cập nhật bằng điều kiện số thứ tự như trên.
      - h:
          en: Housekeeping
          vi: Dọn dẹp
        tag: senior
        p:
          en: Delete outbox rows after capture, and compact the small files that streaming writes leave in Iceberg.
          vi: Xóa các dòng outbox sau khi đã capture, và compact các file nhỏ mà ghi streaming để lại trong Iceberg.
    n:
      en: The outbox column names shown are the Debezium EventRouter defaults; check the current Debezium documentation for routing options. The Iceberg sink can be Kafka Connect, Flink or Spark Structured Streaming.
      vi: Tên cột outbox ở đây là mặc định của Debezium EventRouter; hãy xem tài liệu Debezium hiện hành cho các tùy chọn định tuyến. Sink vào Iceberg có thể là Kafka Connect, Flink hoặc Spark Structured Streaming.
  - id: cqrs-separate-write-and-read-models
    k: cards
    t:
      en: "CQRS: separate the write model from the read models"
      vi: "CQRS: tách mô hình ghi khỏi các mô hình đọc"
    lead:
      en: Command Query Responsibility Segregation (CQRS) uses one model to change data and different models to read it, so each side can be shaped and scaled for its own job.
      vi: Command Query Responsibility Segregation (CQRS) dùng một mô hình để thay đổi dữ liệu và các mô hình khác để đọc, để mỗi phía được thiết kế và scale cho đúng việc của nó.
    cols: 3
    cards:
      - h:
          en: How it works
          vi: Cách hoạt động
        tag: must
        p:
          en: Commands validate and update a normalized write store. Changes flow as events or CDC into one or more read stores shaped for queries.
          vi: Command kiểm tra và cập nhật một write store đã chuẩn hóa. Thay đổi chảy dưới dạng sự kiện hoặc CDC vào một hay nhiều read store được thiết kế cho truy vấn.
      - h:
          en: Event sourcing is separate
          vi: Event sourcing là chuyện khác
        tag: senior
        p:
          en: Event sourcing stores the event log as the source of truth. It pairs well with CQRS but neither requires the other.
          vi: Event sourcing lưu log sự kiện làm nguồn sự thật. Nó đi cùng CQRS rất hợp nhưng không cái nào bắt buộc cái kia.
      - h:
          en: When it helps
          vi: Khi nào có ích
        tag: senior
        p:
          en: Reads vastly outnumber writes, or reads need different shapes such as search indexes, aggregates or per-user views.
          vi: Lượt đọc vượt xa lượt ghi, hoặc phía đọc cần hình dạng khác như chỉ mục tìm kiếm, bảng tổng hợp hoặc view theo từng người dùng.
      - h:
          en: The data platform link
          vi: Liên hệ với nền tảng dữ liệu
        tag: senior
        p:
          en: A warehouse fed by CDC is already a read model. Serving stores such as Elasticsearch, Redis or Pinot built from Kafka are CQRS projections.
          vi: Warehouse được nạp qua CDC vốn đã là một read model. Các serving store như Elasticsearch, Redis hay Pinot dựng từ Kafka chính là projection kiểu CQRS.
      - h:
          en: Eventual consistency
          vi: Nhất quán cuối cùng
        tag: senior
        p:
          en: Read models lag the write model. Users may not see their own change immediately unless you route that read to the write side.
          vi: Read model trễ hơn write model. Người dùng có thể không thấy ngay thay đổi của chính họ trừ khi bạn định tuyến lần đọc đó về phía ghi.
      - h:
          en: Pitfalls
          vi: Cạm bẫy
        tag: senior
        p:
          en: Extra moving parts for simple CRUD, projections that drift silently, and no plan to rebuild a read model from scratch.
          vi: Thêm nhiều thành phần cho CRUD đơn giản, projection lệch âm thầm, và không có kế hoạch dựng lại read model từ đầu.
    n:
      en: Monitor projection lag like consumer lag, and keep the ability to replay from the log or a snapshot. A read model you cannot rebuild is a liability.
      vi: Theo dõi độ trễ của projection như consumer lag, và giữ khả năng replay từ log hoặc snapshot. Một read model không dựng lại được là một gánh nặng.
  - id: api-gateway-the-front-door
    k: cards
    t:
      en: "API gateway: the single front door to backend services"
      vi: "API gateway: cửa trước duy nhất vào các dịch vụ backend"
    lead:
      en: An API gateway is a reverse proxy that every client calls instead of calling services directly. It applies cross-cutting policy once, then routes each request to the right backend.
      vi: API gateway là một reverse proxy mà mọi client gọi thay vì gọi trực tiếp dịch vụ. Nó áp dụng chính sách chung một lần, rồi định tuyến từng request đến đúng backend.
    cols: 3
    cards:
      - h:
          en: What it handles
          vi: Nó xử lý gì
        tag: must
        p:
          en: Routing, TLS termination, authentication and token checks, rate limits and quotas, request shaping, caching and access logs.
          vi: Định tuyến, kết thúc TLS, xác thực và kiểm tra token, giới hạn tốc độ và quota, biến đổi request, cache và access log.
      - h:
          en: Gateway versus load balancer
          vi: Gateway so với load balancer
        tag: must
        p:
          en: A load balancer spreads traffic across replicas of one service. A gateway understands APIs and applies policy per route; it usually sits behind a load balancer.
          vi: Load balancer rải traffic qua các replica của một dịch vụ. Gateway hiểu API và áp chính sách theo từng route; nó thường đứng sau một load balancer.
      - h:
          en: Examples
          vi: Ví dụ
        tag: nice
        p:
          en: Kong, Envoy-based gateways, AWS API Gateway, Azure API Management and Apigee.
          vi: Kong, các gateway dựa trên Envoy, AWS API Gateway, Azure API Management và Apigee.
      - h:
          en: Why data engineers care
          vi: Vì sao data engineer quan tâm
        tag: senior
        p:
          en: Ingestion from partner APIs hits their gateway, so 429s and quotas shape your extract design. Data products and metric APIs you publish need a gateway too.
          vi: Ingestion từ API đối tác đi qua gateway của họ, nên lỗi 429 và quota định hình thiết kế extract của bạn. Data product và metric API bạn công bố cũng cần gateway.
      - h:
          en: Timeouts
          vi: Timeout
        tag: senior
        p:
          en: Managed gateways often cap a request at tens of seconds. Long exports should be asynchronous jobs that return a link, not one slow request.
          vi: Gateway managed thường giới hạn một request ở vài chục giây. Export dài nên là job bất đồng bộ trả về đường dẫn, không phải một request chậm.
      - h:
          en: Pitfalls
          vi: Cạm bẫy
        tag: senior
        p:
          en: A single gateway instance is a single point of failure; business logic creeping into gateway plugins; and an extra network hop on every call.
          vi: Một instance gateway duy nhất là điểm lỗi đơn; logic nghiệp vụ lén lút đi vào plugin của gateway; và thêm một chặng mạng cho mọi lời gọi.
    n:
      en: When debugging a 502 or 504 from an API source, first ask whether the gateway or the backend produced it. Gateway logs and request ids answer that quickly.
      vi: Khi debug lỗi 502 hoặc 504 từ một nguồn API, trước tiên hãy hỏi gateway hay backend gây ra nó. Log của gateway và request id trả lời điều đó rất nhanh.
  - id: serverless-computing-for-data
    k: cards
    t:
      en: Serverless computing for data workloads
      vi: Serverless computing cho workload dữ liệu
    lead:
      en: Serverless means the provider runs and scales the servers while you submit code or queries and pay per use. There are still servers; you just do not size, patch or keep them running.
      vi: Serverless nghĩa là nhà cung cấp vận hành và scale máy chủ còn bạn chỉ gửi code hoặc query và trả tiền theo mức dùng. Vẫn có máy chủ; chỉ là bạn không phải định cỡ, vá lỗi hay giữ chúng chạy.
    cols: 3
    cards:
      - h:
          en: Flavours
          vi: Các dạng
        tag: must
        p:
          en: Functions (AWS Lambda, Cloud Functions, Azure Functions), serverless SQL (BigQuery, Athena, serverless warehouses) and serverless Spark (EMR Serverless, Dataproc Serverless).
          vi: Function (AWS Lambda, Cloud Functions, Azure Functions), SQL serverless (BigQuery, Athena, warehouse serverless) và Spark serverless (EMR Serverless, Dataproc Serverless).
      - h:
          en: Billing model
          vi: Mô hình tính phí
        tag: must
        p:
          en: Per request, per second of compute or per byte scanned. Idle costs nothing, but a careless query costs a lot.
          vi: Theo request, theo giây compute hoặc theo byte quét. Lúc nhàn rỗi không tốn gì, nhưng một query cẩu thả có thể rất đắt.
      - h:
          en: Where it fits
          vi: Khi nào phù hợp
        tag: senior
        p:
          en: Spiky or event-driven work such as file-arrival triggers, small APIs, ad hoc analysis, and teams too small to run clusters.
          vi: Việc theo đợt hoặc hướng sự kiện như trigger khi file đến, API nhỏ, phân tích ad hoc, và đội quá nhỏ để vận hành cluster.
      - h:
          en: Serverless over open tables
          vi: Serverless trên bảng mở
        tag: senior
        p:
          en: Engines such as Athena, BigQuery and Snowflake can query Iceberg tables in your own bucket, so the data stays put while the compute is rented per query.
          vi: Các engine như Athena, BigQuery và Snowflake có thể truy vấn bảng Iceberg trong bucket của bạn, nên dữ liệu nằm yên còn compute được thuê theo từng query.
      - h:
          en: Limits
          vi: Giới hạn
        tag: senior
        p:
          en: Cold starts, maximum run times (Lambda stops at 15 minutes), memory caps and concurrency limits that can flood a downstream database.
          vi: Cold start, thời gian chạy tối đa (Lambda dừng ở 15 phút), giới hạn bộ nhớ và giới hạn concurrency có thể làm ngập database phía sau.
      - h:
          en: Cost crossover
          vi: Điểm giao chi phí
        tag: senior
        p:
          en: For steady, high-utilization workloads, reserved or provisioned capacity is usually cheaper. Compare cost per unit of work at your real volume.
          vi: Với workload đều đặn và sử dụng cao, năng lực đặt trước hoặc provisioned thường rẻ hơn. So sánh chi phí trên mỗi đơn vị công việc ở khối lượng thật.
    n:
      en: Put budgets and per-query byte limits on serverless SQL from day one; the most common surprise bill is a full scan of an unpartitioned table run on a schedule.
      vi: Đặt ngân sách và giới hạn byte theo query cho SQL serverless ngay từ ngày đầu; hóa đơn bất ngờ phổ biến nhất là một lần quét toàn bộ bảng không partition chạy theo lịch.
  - id: multi-cloud-architecture
    k: cards
    t:
      en: Multi-cloud architecture
      vi: Kiến trúc multi-cloud
    lead:
      en: Multi-cloud means running workloads on more than one public cloud provider at the same time. It differs from hybrid cloud, which combines on-premises systems with a cloud.
      vi: Multi-cloud là chạy workload trên nhiều hơn một nhà cung cấp cloud công cộng cùng lúc. Nó khác hybrid cloud, vốn kết hợp hệ thống on-premises với cloud.
    cols: 3
    cards:
      - h:
          en: Why organizations do it
          vi: Vì sao tổ chức làm vậy
        tag: must
        p:
          en: Best-fit services per cloud, data-residency rules, acquisitions that arrive on another cloud, negotiating leverage and resilience.
          vi: Dịch vụ phù hợp nhất ở từng cloud, quy định lưu trú dữ liệu, các vụ sáp nhập mang theo cloud khác, sức mạnh đàm phán và khả năng chống chịu.
      - h:
          en: The costs
          vi: Cái giá phải trả
        tag: must
        p:
          en: Egress fees between clouds, duplicated IAM, networking and skills, and a drift toward features every cloud supports.
          vi: Phí egress giữa các cloud, IAM, mạng và kỹ năng bị nhân đôi, và xu hướng chỉ dùng tính năng mà mọi cloud đều hỗ trợ.
      - h:
          en: Open tables as the common layer
          vi: Bảng mở làm lớp chung
        tag: senior
        p:
          en: Iceberg tables in object storage with a shared REST catalog can be read by engines in any cloud, so data is not tied to one vendor's compute.
          vi: Bảng Iceberg trên object storage với REST catalog dùng chung có thể được engine ở bất kỳ cloud nào đọc, nên dữ liệu không bị gắn với compute của một vendor.
      - h:
          en: Federated query
          vi: Truy vấn liên kết
        tag: senior
        p:
          en: Engines such as Trino or BigQuery Omni query data where it lives. Filters are pushed down, but cross-cloud joins still move bytes.
          vi: Các engine như Trino hay BigQuery Omni truy vấn dữ liệu tại chỗ. Bộ lọc được đẩy xuống nguồn, nhưng join liên cloud vẫn phải di chuyển byte.
      - h:
          en: A pragmatic pattern
          vi: Một mô hình thực dụng
        tag: senior
        p:
          en: One primary cloud plus portability — open formats, Terraform, containers and a tested export — instead of active-active across clouds.
          vi: Một cloud chính kèm tính di động — định dạng mở, Terraform, container và đường export đã được test — thay vì active-active trên nhiều cloud.
      - h:
          en: Pitfall
          vi: Cạm bẫy
        tag: senior
        p:
          en: Treating multi-cloud as a DR plan. Failing over to another cloud needs the data, identities and runbooks already there, and rehearsed.
          vi: Coi multi-cloud là kế hoạch DR. Failover sang cloud khác cần dữ liệu, danh tính và runbook có sẵn ở đó, và đã được diễn tập.
    n:
      en: Ask what problem multi-cloud solves for this organization. If the answer is vague, a single cloud with open formats and a credible exit plan is usually cheaper and safer.
      vi: Hãy hỏi multi-cloud giải quyết vấn đề gì cho tổ chức này. Nếu câu trả lời mơ hồ, một cloud duy nhất với định dạng mở và kế hoạch thoát đáng tin thường rẻ và an toàn hơn.
  - id: checklist-and-interview-questions
    k: check
    t:
      en: Checklist and interview questions
      vi: Checklist và câu hỏi phỏng vấn
    left:
      h:
        en: Self-check
        vi: Tự kiểm tra
      items:
        - en: I can localize a network problem by layer
          vi: Tôi khoanh vùng được sự cố mạng theo tầng
        - en: I can find why a process was killed
          vi: Tôi tìm được lý do một process bị giết
        - en: I can roll back code and data separately
          vi: Tôi rollback được code và dữ liệu một cách riêng biệt
        - en: I can name the anomalies each isolation level allows
          vi: Tôi nêu được các bất thường mà mỗi isolation level cho phép
        - en: I can read an execution plan and justify an index
          vi: Tôi đọc được execution plan và biện minh cho một index
    right:
      h:
        en: Interview-style questions
        vi: Câu hỏi kiểu phỏng vấn
      items:
        - en: A job connects fine from your laptop but times out in production. What do you check, in order?
          vi: Job kết nối tốt từ laptop nhưng timeout ở production. Bạn kiểm tra gì, theo thứ tự?
        - en: A container disappears with no error in its logs. What happened?
          vi: Một container biến mất mà log không có lỗi. Chuyện gì đã xảy ra?
        - en: How do you roll back a deployment that already changed a warehouse table?
          vi: Bạn rollback thế nào một lần deploy đã làm đổi bảng warehouse?
        - en: Two jobs update the same row at once. What can go wrong and how do you prevent it?
          vi: Hai job cập nhật cùng một dòng cùng lúc. Có thể sai gì và ngăn thế nào?
    n:
      en: Strong answers name the observation tool before proposing a fix.
      vi: Câu trả lời tốt nêu công cụ quan sát trước khi đề xuất cách sửa.
