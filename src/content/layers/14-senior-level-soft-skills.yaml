layer: 14
slides:
  - id: senior-level-soft-skills-multiplying-your-impact
    k: cards
    t:
      en: "Senior-level soft skills: multiplying your impact"
      vi: "Kỹ năng mềm cấp senior: nhân bội tác động của bạn"
    lead:
      en: Beyond a point, technical depth is table stakes. What separates senior engineers is judgment, communication and the ability to make a team better.
      vi: Qua một ngưỡng, chiều sâu kỹ thuật chỉ là điều kiện cần. Điều phân biệt senior là phán đoán, giao tiếp và khả năng làm đội tốt hơn.
    cols: 3
    cards:
      - h:
          en: Stakeholder management
          vi: Quản lý stakeholder
        tag: must
        p:
          en: Understand the decision behind the request, set expectations, and say no with alternatives.
          vi: Hiểu quyết định đằng sau yêu cầu, đặt kỳ vọng, và từ chối kèm phương án thay thế.
      - h:
          en: Metric definition and alignment
          vi: Định nghĩa và thống nhất metric
        tag: senior
        p:
          en: Get finance, product and sales to agree on one definition, and record who owns it.
          vi: Để tài chính, sản phẩm và bán hàng thống nhất một định nghĩa, và ghi lại ai là người sở hữu.
      - h:
          en: Build versus buy
          vi: Tự build hay mua
        tag: senior
        p:
          en: Evaluate total cost, differentiation, skills, lock-in and exit, not just license price.
          vi: Đánh giá tổng chi phí, tính khác biệt, kỹ năng, lock-in và đường thoát, không chỉ giá license.
      - h:
          en: Cost and performance
          vi: Chi phí và hiệu năng
        tag: senior
        p:
          en: Measure, fix the biggest costs first, and put guardrails in place.
          vi: Đo lường, xử lý các khoản chi phí lớn nhất trước, và đặt guardrail.
      - h:
          en: Mentoring and documentation
          vi: Mentoring và tài liệu
        tag: must
        p:
          en: Teach through review and pairing. Write docs that people actually use.
          vi: Dạy qua review và pairing. Viết tài liệu mà mọi người thực sự dùng.
      - h:
          en: Decisions and prioritization
          vi: Quyết định và ưu tiên
        tag: senior
        p:
          en: Write down decisions (ADRs) and prioritize by impact, effort and risk.
          vi: Ghi lại các quyết định (ADR) và ưu tiên theo tác động, công sức và rủi ro.
    n:
      en: This is the layer people skip because it has no tool names, and it is the one that most determines promotion. Every item here can be practised on your current job.
      vi: Đây là layer mọi người bỏ qua vì nó không có tên công cụ, và cũng là layer quyết định thăng tiến nhiều nhất. Mọi mục ở đây đều có thể luyện tập ngay ở công việc hiện tại.
  - id: frameworks-that-make-judgment-visible
    k: table
    t:
      en: Frameworks that make judgment visible
      vi: Các khung làm việc giúp phán đoán trở nên rõ ràng
    head:
      - en: Framework
        vi: Khung làm việc
      - en: Type
        vi: Loại
      - en: Best for
        vi: Phù hợp nhất
      - en: Strengths
        vi: Điểm mạnh
      - en: Limitations
        vi: Hạn chế
      - en: Effort
        vi: Công sức
    rows:
      - - Architecture Decision Record (ADR)
        - en: Decision log
          vi: Nhật ký quyết định
        - en: Recording significant technical decisions
          vi: Ghi lại các quyết định kỹ thuật quan trọng
        - en: Preserves context; reviewable; lightweight
          vi: Giữ được ngữ cảnh; có thể review; nhẹ
        - en: Becomes bureaucracy if used for trivial choices
          vi: Thành quan liêu nếu dùng cho các lựa chọn tầm thường
        - en: Low (an hour or less each)
          vi: Thấp (mỗi cái một giờ hoặc ít hơn)
      - - RACI / DACI
        - en: Responsibility matrix
          vi: Ma trận trách nhiệm
        - en: Clarifying who decides and who is consulted
          vi: Làm rõ ai quyết định và ai được tham vấn
        - en: Removes ambiguity about ownership
          vi: Loại bỏ sự mơ hồ về quyền sở hữu
        - en: Ignored unless leaders enforce it
          vi: Bị bỏ qua nếu lãnh đạo không thực thi
        - en: Low
          vi: Thấp
      - - en: RICE or impact-effort scoring
          vi: RICE hoặc chấm điểm impact-effort
        - en: Prioritization
          vi: Ưu tiên hóa
        - en: Ranking a backlog of requests
          vi: Xếp hạng backlog các yêu cầu
        - en: Makes assumptions explicit
          vi: Làm rõ các giả định
        - en: Scores are estimates and can be gamed
          vi: Điểm số chỉ là ước lượng và có thể bị lách
        - en: Low to moderate
          vi: Thấp đến vừa
      - - en: Build-versus-buy scorecard
          vi: Scorecard build-versus-buy
        - en: Decision framework
          vi: Khung ra quyết định
        - en: Tool and platform selection
          vi: Chọn công cụ và nền tảng
        - en: Makes criteria comparable
          vi: Giúp các tiêu chí so sánh được
        - en: Weights are subjective
          vi: Trọng số mang tính chủ quan
        - en: Moderate
          vi: Trung bình
      - - en: Metric tree
          vi: Cây metric
        - en: Metric alignment
          vi: Thống nhất metric
        - en: Linking top-level KPIs to their drivers
          vi: Liên kết KPI cấp cao với các yếu tố dẫn dắt
        - en: Shows relationships and exposes conflicting definitions
          vi: Cho thấy quan hệ và làm lộ các định nghĩa mâu thuẫn
        - en: Needs cross-team input
          vi: Cần đúng góp liên team
        - en: Moderate
          vi: Trung bình
      - - en: Blameless postmortem
          vi: Postmortem không đổ lỗi
        - en: Learning process
          vi: Quy trình học hỏi
        - en: Learning from incidents
          vi: Học từ sự cố
        - en: Turns failures into improvements
          vi: Biến thất bại thành cải tiến
        - en: Needs psychological safety
          vi: Cần sự an toàn tâm lý
        - en: Low per incident
          vi: Thấp cho mỗi sự cố
      - - en: Docs-as-code and runbooks
          vi: Docs-as-code và runbook
        - en: Documentation
          vi: Tài liệu
        - en: Onboarding and incident response
          vi: Onboarding và xử lý sự cố
        - en: Versioned with the code; searchable
          vi: Được version cùng code; tìm kiếm được
        - en: Rots without owners and review
          vi: Mục nát nếu không có người sở hữu và review
        - en: Ongoing
          vi: Liên tục
    cap:
      en: Frameworks are scaffolding for conversation. Use the lightest one that gets the decision made.
      vi: Framework là giàn giáo cho cuộc trao đổi. Dùng cái nhẹ nhất giúp ra được quyết định.
    n:
      en: "The common thread: each framework makes a hidden thing visible, whether that is the decision, the owner, the assumption or the trade-off."
      vi: "Điểm chung: mỗi framework làm một thứ ẩn trở nên nhìn thấy được, dù đã là quyết định, người sở hữu, giả định hay sự đánh đổi."
  - id: deep-dive-an-architecture-decision-record-template
    k: code
    t:
      en: "Deep dive: an architecture decision record template"
      vi: "Đào sâu: mẫu architecture decision record"
    lead:
      en: One page, written before or during the decision, stored in the repository next to the code it affects.
      vi: Một trang, viết trước hoặc trong lúc ra quyết định, lưu trong repository cạnh code mà nó ảnh hưởng.
    blocks:
      - lang: md
        title: docs/adr/0007-adopt-dagster-for-orchestration.md
        code: |-
          # ADR-0007: Adopt Dagster for orchestration

          - Status: Proposed | Accepted | Superseded by ADR-00xx
          - Date: 2026-11-10
          - Deciders: Analytics Engineering, Data Platform
          - Consulted: Finance Data, Security
          - Informed: All analytics stakeholders

          ## Context
          What problem are we solving? Constraints, scale, team skills, deadlines.

          ## Decision drivers
          - Must support asset lineage and dbt integration
          - Team of six with one on-call rotation
          - Annual budget ceiling

          ## Options considered
          1. Airflow (managed): familiar to the team, task-based model
          2. Dagster: asset-based model, strong dbt integration
          3. Keep cron and scripts: no cost, no visibility

          ## Decision
          We will adopt ... because ...

          ## Consequences
          - Positive: ...
          - Negative and risks: ...
          - Follow-ups: migration plan, training, review date
    points:
      - h:
          en: Capture the options you rejected
          vi: Ghi lại các phương án bạn đã loại
        p:
          en: The reasoning for “no” is the most valuable part when someone revisits the decision in a year.
          vi: Lý do cho “không” là phần giá trị nhất khi ai đã xem lại quyết định sau một năm.
      - h:
          en: Write it for the future reader
          vi: Viết cho người đọc trong tương lai
        p:
          en: Assume a new teammate with no context. Short, plain and dated.
          vi: Giả định một đồng đội mới không có ngữ cảnh. Ngắn, rõ ràng và có ghi ngày.
      - h:
          en: Supersede, never delete
          vi: Thay thế, không bao giờ xóa
        tag: senior
        p:
          en: When a decision changes, add a new ADR and mark the old one superseded. The history is the point.
          vi: Khi quyết định thay đổi, thêm ADR mới và đánh dấu ADR cũ là superseded. Lịch sử chính là mục đích.
      - h:
          en: Use it for real decisions
          vi: Dùng cho các quyết định thực sự
        p:
          en: Tools, platforms, modeling approaches, major conventions. Not every pull request.
          vi: Công cụ, nền tảng, cách tiếp cận modeling, các quy ước lớn. Không phải mọi pull request.
    n:
      en: "The example is a plausible ADR for the orchestration choice from section 5. The placeholders in the Decision and Consequences sections are intentional: they are the template fields to fill in. Keep ADRs to one page."
      vi: "Ví dụ là một ADR hợp lý cho lựa chọn điều phối ở phần 5. Các placeholder trong mục Decision và Consequences là cố ý: chúng là các trường của template cần điền. Giữ ADR trong một trang."
  - id: build-versus-buy-a-decision-framework
    k: table
    t:
      en: "Build versus buy: a decision framework"
      vi: "Build hay buy: khung ra quyết định"
    head:
      - en: Criterion
        vi: Tiêu chí
      - en: Question to ask
        vi: Câu hỏi cần đặt
      - en: Leans toward buy when
        vi: Nghiêng về mua khi
      - en: Leans toward build when
        vi: Nghiêng về tự xây khi
    rows:
      - - en: Differentiation
          vi: Tính khác biệt
        - en: Does this give us a competitive advantage?
          vi: Điều này có mang lại lợi thế cạnh tranh không?
        - en: It is a commodity, like standard SaaS connectors
          vi: Đây là hàng hóa đại trà, như các SaaS connector chuẩn
        - en: It encodes unique logic or proprietary data
          vi: Nó mã hóa logic độc đào hoặc dữ liệu độc quyền
      - - en: Total cost of ownership
          vi: Tổng chi phí sở hữu
        - en: What are license, people, on-call and upgrade costs over three years?
          vi: Chi phí license, nhân sự, on-call và nâng cấp trong ba năm là bao nhiêu?
        - en: Vendor cost is below the engineering time it saves
          vi: Chi phí vendor thấp hơn thời gian kỹ sư mà nó tiết kiệm được
        - en: Usage-based pricing will far exceed a simple in-house version
          vi: Giá theo mức sử dụng sẽ vượt xa một phiên bản tự làm đơn giản
      - - en: Time to value
          vi: Thời gian tạo ra giá trị
        - en: How soon do we need it?
          vi: Chúng ta cần nó sớm đến mức nào?
        - en: The need is common and urgent
          vi: Nhu cầu phổ biến và cấp bách
        - en: Tight integration will pay off over a long horizon
          vi: Tích hợp chặt chẽ sẽ có lợi trong dài hạn
      - - en: Team skills and capacity
          vi: Kỹ năng và năng lực của team
        - en: Who maintains it at 3 a.m.?
          vi: Ai bảo trì nó lúc 3 giờ sáng?
        - en: The team is small or lacks depth in this area
          vi: Team nhỏ hoặc thiếu chiều sâu ở mảng này
        - en: The team has depth and real spare capacity
          vi: Team có chiều sâu và năng lực dư thực sự
      - - en: Lock-in and exit
          vi: Lock-in và đường thoát
        - en: How hard is it to leave?
          vi: Rời đi khó đến mức nào?
        - en: Standard formats and export paths exist
          vi: Có định dạng chuẩn và đường export
        - en: Vendor formats are proprietary and migration would be painful
          vi: Định dạng của vendor là độc quyền và migration sẽ rất đau đầu
      - - en: Security and compliance
          vi: Bảo mật và tuân thủ
        - en: Does it meet our requirements?
          vi: Nó có đáp ứng yêu cầu của chúng ta không?
        - en: The vendor holds the certifications you need
          vi: Vendor có các chứng nhận bạn cần
        - en: Data cannot leave your environment
          vi: Dữ liệu không được rời khỏi môi trường của bạn
    cap:
      en: Score each criterion, weight them with stakeholders, and record the outcome in an ADR. Revisit when usage or pricing changes.
      vi: Chấm điểm từng tiêu chí, đặt trọng số cùng stakeholder, và ghi kết quả vào một ADR. Xem lại khi mức sử dụng hoặc giá thay đổi.
    n:
      en: "The honest middle path is often “buy and wrap”: buy the commodity, build the thin layer that keeps you portable. Revisit decisions as pricing and team size change."
      vi: "Con đường trung dung thực tế thường là “mua và bọc lại”: mua phần hàng hóa đại trà, tự build lớp mỏng giúp bạn giữ tính di động. Xem lại các quyết định khi giá và quy mô team thay đổi."
  - id: stakeholders-and-metric-alignment
    k: cards
    t:
      en: Stakeholders and metric alignment
      vi: Stakeholder và thống nhất định nghĩa metric
    lead:
      en: Most data disputes are definition disputes. Facilitate the conversation rather than picking a number.
      vi: Hầu hết tranh chấp về dữ liệu là tranh chấp về định nghĩa. Hãy điều phối cuộc trao đổi thay vì tự chọn một con số.
    cols: 3
    cards:
      - h:
          en: Ask for the decision, not the dashboard
          vi: Hỏi về quyết định, không phải dashboard
        p:
          en: “What will you do differently if this number goes up?” often changes the request.
          vi: “Bạn sẽ làm khác đi điều gì nếu con số này tăng?” thường làm thay đổi yêu cầu.
        tag: senior
      - h:
          en: Set expectations early
          vi: Đặt kỳ vọng sớm
        p:
          en: Agree on scope, freshness, accuracy and delivery date. Say what you are not doing.
          vi: Thống nhất phạm vi, độ tươi, độ chính xác và ngày bàn giao. Nói rõ điều bạn không làm.
        tag: must
      - h:
          en: Say no with options
          vi: Từ chối kèm lựa chọn
        p:
          en: Offer a smaller version, a later date or a different approach, with the trade-off stated.
          vi: Đề xuất phiên bản nhỏ hơn, ngày muộn hơn hoặc cách tiếp cận khác, kèm sự đánh đổi được nêu rõ.
        tag: senior
      - h:
          en: Collect existing definitions
          vi: Thu thập các định nghĩa hiện có
        p:
          en: Find every current version of the metric and where it is used. Show the differences with real examples.
          vi: Tìm mọi phiên bản hiện tại của metric và nơi nó được dùng. Chỉ ra các khác biệt bằng ví dụ thật.
        tag: senior
      - h:
          en: Decide with owners
          vi: Quyết định cùng người sở hữu
        p:
          en: Convene the owners, agree on one definition and a name, and record the decision.
          vi: Triệu tập các owner, thống nhất một định nghĩa và một tên gọi, và ghi lại quyết định.
        tag: senior
      - h:
          en: Encode, announce, deprecate
          vi: Mã hóa, thông báo, ngừng dùng
        p:
          en: Put the definition in the semantic layer, tell users what changed, and retire the old versions.
          vi: Đưa định nghĩa vào semantic layer, báo người dùng điều gì đã thay đổi, và loại bỏ các phiên bản cũ.
        tag: senior
    n:
      en: The first three are about requests; the last three form a repeatable process for metric alignment. Emphasize recording the decision so the argument does not restart in six months.
      vi: Ba bước đầu nói về yêu cầu; ba bước cuối tạo thành quy trình lặp lại để thống nhất metric. Nhấn mạnh việc ghi lại quyết định để cuộc tranh luận không bắt đầu lại sau sáu tháng.
  - id: operating-habits-cost-mentoring-documentation-priorities
    k: cards
    t:
      en: "Operating habits: cost, mentoring, documentation, priorities"
      vi: "Thói quen vận hành: chi phí, mentor, tài liệu, ưu tiên"
    cols: 2
    cards:
      - h:
          en: Cost and performance optimization
          vi: Tối ưu chi phí và hiệu năng
        tag: senior
        list:
          - en: "Measure first: rank queries and pipelines by cost"
            vi: "Đo trước: xếp hạng query và pipeline theo chi phí"
          - en: Fix the top few items, not everything
            vi: Xử lý vài mục đứng đầu, không phải tất cả
          - en: "Add guardrails: budgets, timeouts, monitors"
            vi: "Thêm guardrail: ngân sách, timeout, monitor"
          - en: Review monthly and report savings in business terms
            vi: Review hằng tháng và báo cáo khoản tiết kiệm bằng ngôn ngữ kinh doanh
      - h: Mentoring
        tag: senior
        list:
          - en: Review code to teach, not just to approve
            vi: Review code để dạy, không chỉ để duyệt
          - en: Pair on hard problems, then step back
            vi: Pair trên các vấn đề khó, rồi lùi lại
          - en: Delegate with context and room to fail safely
            vi: Giao việc kèm ngữ cảnh và không gian để thất bại an toàn
          - en: Give specific, timely feedback
            vi: Đưa feedback cụ thể, kịp thời
      - h:
          en: Documentation
          vi: Tài liệu
        tag: must
        list:
          - en: Docs live with the code and have owners
            vi: Tài liệu nằm cùng code và có owner
          - en: Write for onboarding and incident response first
            vi: Ưu tiên viết cho onboarding và xử lý sự cố
          - en: Prefer examples and runbooks to prose
            vi: Ưu tiên ví dụ và runbook hơn văn xuôi
          - en: Delete stale docs
            vi: Xóa tài liệu lỗi thời
      - h:
          en: Prioritization
          vi: Ưu tiên hóa
        tag: senior
        list:
          - en: Rank by impact, effort and risk with stakeholders
            vi: Xếp hạng theo tác động, công sức và rủi ro cùng stakeholder
          - en: Protect time for reliability and debt
            vi: Dành thời gian cho độ tin cậy và technical debt
          - en: Make trade-offs visible in a shared backlog
            vi: Làm cho các đánh đổi hiển thị trong một backlog chung
          - en: Say what is deliberately not being done
            vi: Nói rõ điều gì được cố ý không làm
    n:
      en: Each habit is small. The compounding effect comes from doing them consistently, in public, so the team copies them.
      vi: Mỗi thói quen đều nhỏ. Hiệu ứng cộng dồn đến từ việc làm chúng nhất quán, công khai, để team bắt chước.
  - id: common-pitfalls-and-anti-patterns
    k: pit
    t:
      en: Common pitfalls and anti-patterns
      vi: Lỗi thường gặp và anti-pattern
    rows:
      - bad:
          en: Being the hero who fixes everything.
          vi: Làm “anh hùng” sửa mọi thứ.
        why:
          en: Creates a bottleneck and a single point of failure.
          vi: Tạo ra nút thắt cổ chai và điểm lỗi đơn lẻ.
        fix:
          en: Teach, document and delegate.
          vi: Dạy, ghi tài liệu và giao việc.
      - bad:
          en: Saying yes to every request.
          vi: Đồng ý với mọi yêu cầu.
        why:
          en: Quality and reliability suffer.
          vi: Chất lượng và độ tin cậy bị ảnh hưởng.
        fix:
          en: Prioritize openly; offer alternatives.
          vi: Ưu tiên công khai; đưa ra phương án thay thế.
      - bad:
          en: Choosing tools by enthusiasm.
          vi: Chọn công cụ theo cảm hứng.
        why:
          en: Hidden costs and maintenance burden.
          vi: Chi phí ẩn và gánh nặng bảo trì.
        fix:
          en: Scorecard, proof of concept and an ADR.
          vi: Scorecard, proof of concept và một ADR.
      - bad:
          en: Settling metric disputes by seniority.
          vi: Giải quyết tranh chấp metric theo thâm niên.
        why:
          en: Resentment and re-opened arguments.
          vi: Oán giận và các tranh luận bị mở lại.
        fix:
          en: Convene owners and record the decision.
          vi: Triệu tập owner và ghi lại quyết định.
      - bad:
          en: Documentation as a one-off project.
          vi: Tài liệu như một dự án làm một lần.
        why:
          en: Rots within months.
          vi: Mục nát trong vài tháng.
        fix:
          en: Docs-as-code with owners and review.
          vi: Docs-as-code có owner và review.
      - bad:
          en: Optimizing cost without measuring.
          vi: Tối ưu chi phí mà không đo lường.
        why:
          en: Effort goes to the wrong places.
          vi: Công sức dồn vào sai chỗ.
        fix:
          en: Rank by actual spend first.
          vi: Xếp hạng theo chi tiêu thực tế trước.
    n:
      en: The hero pattern is the most common in strong mid-level engineers, and the hardest to see in yourself.
      vi: Mô thức anh hùng phổ biến nhất ở các kỹ sư mid-level giỏi, và khó nhận ra nhất ở chính mình.
  - id: what-senior-looks-like-the-whole-role
    k: cards
    t:
      en: "What senior looks like: the whole role"
      vi: "Senior trông như thế nào: toàn bộ vai trò"
    cols: 3
    cards:
      - h:
          en: Decisions
          vi: Quyết định
        tag: senior
        list:
          - en: What to build, buy or leave alone
            vi: Nên build, mua hay bỏ qua cái gì
          - en: What to prioritize and what to drop
            vi: Nên ưu tiên gì và bỏ gì
          - en: Where the team needs standards
            vi: Nơi team cần tiêu chuẩn
      - h:
          en: Trade-offs
          vi: Đánh đổi
        tag: senior
        list:
          - en: Speed versus reliability
            vi: Tốc độ so với độ tin cậy
          - en: Local optimization versus team health
            vi: Tối ưu cục bộ so với sức khỏe của team
          - en: Perfect versus shipped
            vi: Hoàn hảo so với đã ship
          - en: Autonomy versus consistency
            vi: Tự chủ so với nhất quán
      - h:
          en: Responsibilities
          vi: Trách nhiệm
        tag: senior
        list:
          - en: Make others more effective
            vi: Giúp người khác làm việc hiệu quả hơn
          - en: Communicate risk and uncertainty clearly
            vi: Truyền đạt rõ rủi ro và độ bất định
          - en: Own outcomes, not just tasks
            vi: Chịu trách nhiệm về kết quả, không chỉ nhiệm vụ
          - en: Leave decisions, docs and systems better than you found them
            vi: Để lại các quyết định, tài liệu và hệ thống tốt hơn lúc bạn nhận
    n:
      en: "Summarize the deck here: across every layer the senior pattern is the same. Own outcomes, make trade-offs explicit, write decisions down, and raise the level of the people around you."
      vi: "Tổng kết deck ở đây: ở mọi layer, mô thức của người senior đều giống nhau. Chịu trách nhiệm về kết quả, làm rõ các đánh đổi, ghi lại quyết định, và nâng tầm những người xung quanh."
  - id: data-roles-cdo-architect-dba-product-manager
    k: table
    t:
      en: "Data roles: CDO, data architect, DBA and data product manager"
      vi: "Các vai trò dữ liệu: CDO, data architect, DBA và data product manager"
    lead:
      en: Senior engineers work with all four roles. Knowing what each one owns, and is measured on, tells you who must agree before a platform decision sticks.
      vi: Kỹ sư senior làm việc với cả bốn vai trò này. Biết mỗi vai trò sở hữu gì và được đánh giá bằng gì cho bạn biết ai phải đồng ý trước khi một quyết định nền tảng có hiệu lực.
    head:
      - en: Role
        vi: Vai trò
      - en: Owns
        vi: Sở hữu
      - en: Typical decisions
        vi: Quyết định điển hình
      - en: Success looks like
        vi: Thành công trông thế nào
      - en: Common pitfall
        vi: Cạm bẫy thường gặp
    rows:
      - - en: Chief Data Officer (CDO)
          vi: Giám đốc dữ liệu (CDO)
        - en: Enterprise data strategy, governance, privacy and compliance, and increasingly the value created from data
          vi: Chiến lược dữ liệu toàn doanh nghiệp, quản trị, quyền riêng tư và tuân thủ, và ngày càng cả giá trị tạo ra từ dữ liệu
        - en: Priorities and budget, governance policy, operating model (central, hub-and-spoke or mesh)
          vi: Ưu tiên và ngân sách, chính sách quản trị, mô hình vận hành (tập trung, hub-and-spoke hay mesh)
        - en: Business outcomes traced to data, trusted metrics, clean audits
          vi: Kết quả kinh doanh truy được về dữ liệu, metric đáng tin, kiểm toán sạch
        - en: A mandate without budget or authority; the reporting line (CEO, CFO, CIO) often reveals which one is missing
          vi: Có nhiệm vụ nhưng không có ngân sách hay quyền hạn; tuyến báo cáo (CEO, CFO, CIO) thường cho thấy thiếu cái nào
      - - en: Data architect
          vi: Data architect
        - en: Target architecture, data models, integration patterns and platform standards
          vi: Kiến trúc mục tiêu, mô hình dữ liệu, mẫu tích hợp và chuẩn nền tảng
        - en: Storage and table format (for example an open Iceberg lakehouse), modelling conventions, reference designs, ADRs
          vi: Lưu trữ và table format (ví dụ lakehouse Iceberg mở), quy ước mô hình hóa, thiết kế tham chiếu, ADR
        - en: Teams ship quickly inside shared guardrails; few one-off designs
          vi: Các đội phát hành nhanh trong guardrail chung; ít thiết kế lẻ tẻ
        - en: Diagrams nobody follows because the architect no longer builds anything
          vi: Sơ đồ không ai làm theo vì architect không còn trực tiếp xây dựng gì
      - - en: Database administrator (DBA)
          vi: Quản trị viên cơ sở dữ liệu (DBA)
        - en: Availability, performance, security and recoverability of databases
          vi: Tính sẵn sàng, hiệu năng, bảo mật và khả năng khôi phục của database
        - en: Backups, HA and DR setup, indexing and query tuning, role-based access, upgrades
          vi: Backup, thiết lập HA và DR, đánh index và tối ưu query, phân quyền theo role, nâng cấp
        - en: RPO and RTO met in drills; predictable latency; least-privilege access
          vi: Đạt RPO và RTO trong diễn tập; độ trễ ổn định; quyền truy cập tối thiểu
        - en: Becoming a ticket queue. In the cloud era managed services handle hardware and patching, so the role shifts to performance, cost and automation
          vi: Trở thành hàng đợi ticket. Trong thời cloud, dịch vụ managed lo phần cứng và vá lỗi, nên vai trò chuyển sang hiệu năng, chi phí và tự động hóa
      - - en: Data product manager
          vi: Data product manager
        - en: A data product (data set, metric layer, feature store, data API) treated like a software product
          vi: Một data product (tập dữ liệu, metric layer, feature store, data API) được đối xử như sản phẩm phần mềm
        - en: Who the users are, what to build or retire, SLAs and SLOs, contracts with consumers
          vi: Người dùng là ai, xây hay ngừng cái gì, SLA và SLO, hợp đồng với bên tiêu thụ
        - en: Adoption, user satisfaction, decisions influenced, SLOs met
          vi: Mức độ sử dụng, sự hài lòng của người dùng, số quyết định bị ảnh hưởng, đạt SLO
        - en: Counting tables shipped instead of usage and outcomes
          vi: Đếm số bảng đã giao thay vì mức sử dụng và kết quả
    cap:
      en: Titles vary between companies; responsibilities do not. Map the people in your organization to these columns before proposing a platform change.
      vi: Chức danh khác nhau giữa các công ty; trách nhiệm thì không. Hãy ánh xạ người trong tổ chức của bạn vào các cột này trước khi đề xuất thay đổi nền tảng.
    n:
      en: A CDO focused on defence (risk, compliance) and one focused on offence (growth, analytics) will sponsor very different projects. Find out which one you have.
      vi: Một CDO thiên về phòng thủ (rủi ro, tuân thủ) và một CDO thiên về tấn công (tăng trưởng, phân tích) sẽ bảo trợ những dự án rất khác nhau. Hãy tìm hiểu bạn đang có kiểu nào.
  - id: data-strategy-and-data-driven-decisions
    k: cards
    t:
      en: Data strategy and data-driven decision making
      vi: Chiến lược dữ liệu và ra quyết định dựa trên dữ liệu
    lead:
      en: A data strategy is the executive-level plan that ties data work to business objectives. Data-driven decision making is the habit that proves the strategy is working.
      vi: Chiến lược dữ liệu là kế hoạch cấp lãnh đạo gắn công việc dữ liệu với mục tiêu kinh doanh. Ra quyết định dựa trên dữ liệu là thói quen chứng minh chiến lược đang hiệu quả.
    cols: 3
    cards:
      - h:
          en: What a data strategy contains
          vi: Chiến lược dữ liệu gồm những gì
        tag: senior
        p:
          en: Business goals and priority use cases, the data and platform needed, governance, people and operating model, a funded roadmap, and the metrics that show progress.
          vi: Mục tiêu kinh doanh và use case ưu tiên, dữ liệu và nền tảng cần có, quản trị, con người và mô hình vận hành, lộ trình có ngân sách, và các metric cho thấy tiến độ.
      - h:
          en: Start from decisions
          vi: Bắt đầu từ quyết định
        tag: senior
        p:
          en: Work backwards from a few decisions the business must make better, such as pricing or churn. Each use case justifies the data and platform beneath it.
          vi: Đi ngược từ vài quyết định mà doanh nghiệp cần làm tốt hơn, như định giá hay churn. Mỗi use case biện minh cho dữ liệu và nền tảng bên dưới nó.
      - h:
          en: Strategy anti-patterns
          vi: Phản mẫu chiến lược
        tag: senior
        p:
          en: A tool shopping list presented as strategy, trying to fix all data at once, and a plan with no owner or budget.
          vi: Một danh sách mua công cụ được gọi là chiến lược, cố sửa toàn bộ dữ liệu cùng lúc, và kế hoạch không có người sở hữu hay ngân sách.
      - h:
          en: Data-driven decision making
          vi: Ra quyết định dựa trên dữ liệu
        tag: must
        p:
          en: Base choices on measured evidence rather than intuition alone. Agree on the decision, the metric and the threshold before looking at the numbers.
          vi: Dựa lựa chọn vào bằng chứng đo được chứ không chỉ trực giác. Thống nhất quyết định, metric và ngưỡng trước khi nhìn vào số liệu.
      - h:
          en: What makes it possible
          vi: Điều gì làm nó khả thi
        tag: senior
        p:
          en: Certified metrics from a single source of truth, KPI trees that link inputs to outcomes, A/B tests with guardrail metrics, and decision logs.
          vi: Metric được chứng nhận từ một nguồn sự thật duy nhất, cây KPI nối đầu vào với kết quả, A/B test có metric guardrail, và nhật ký quyết định.
      - h:
          en: Pitfalls
          vi: Cạm bẫy
        tag: senior
        p:
          en: "Vanity metrics, Goodhart's law (a target stops being a good measure), peeking at experiments early, and trusting numbers whose quality nobody checks."
          vi: "Metric phù phiếm, định luật Goodhart (khi thành chỉ tiêu thì metric không còn đo tốt), xem kết quả thí nghiệm quá sớm, và tin vào số liệu mà không ai kiểm tra chất lượng."
    n:
      en: Engineers contribute to strategy by sizing what the platform can deliver and by making metrics trustworthy. "Data-informed" is a fair goal; judgment still decides when the data is thin.
      vi: Kỹ sư đóng góp vào chiến lược bằng cách ước lượng những gì nền tảng làm được và làm cho metric đáng tin. "Data-informed" là mục tiêu hợp lý; khi dữ liệu mỏng thì phán đoán vẫn là thứ quyết định.
  - id: centralized-versus-data-mesh-versus-data-fabric
    k: table
    t:
      en: Centralized platform, data mesh and data fabric
      vi: Nền tảng tập trung, data mesh và data fabric
    lead:
      en: Data mesh is mainly an organizational model; data fabric is mainly a technology approach. They answer different questions and can be combined.
      vi: Data mesh chủ yếu là mô hình tổ chức; data fabric chủ yếu là cách tiếp cận công nghệ. Chúng trả lời các câu hỏi khác nhau và có thể kết hợp.
    head:
      - en: Aspect
        vi: Khía cạnh
      - en: Centralized data team
        vi: Đội dữ liệu tập trung
      - Data mesh
      - Data fabric
    rows:
      - - en: Core idea
          vi: Ý tưởng cốt lõi
        - en: One team builds and runs the warehouse and pipelines for everyone
          vi: Một đội xây và vận hành warehouse và pipeline cho tất cả
        - en: "Four principles: domain ownership, data as a product, a self-serve platform, federated computational governance"
          vi: "Bốn nguyên tắc: domain sở hữu dữ liệu, dữ liệu là sản phẩm, nền tảng tự phục vụ, quản trị liên bang bằng tính toán"
        - en: An integration layer driven by active metadata that connects data across clouds and on-premises systems
          vi: Một lớp tích hợp vận hành bằng active metadata, kết nối dữ liệu xuyên cloud và hệ thống on-premises
      - - en: Who owns the data
          vi: Ai sở hữu dữ liệu
        - en: The central team
          vi: Đội trung tâm
        - en: Domain teams, as data products
          vi: Các đội domain, dưới dạng data product
        - en: Unchanged; the fabric connects existing owners
          vi: Không đổi; fabric kết nối các chủ sở hữu hiện có
      - - en: How data is integrated
          vi: Cách tích hợp dữ liệu
        - en: Copy everything into one store
          vi: Sao chép mọi thứ vào một kho
        - en: Published product interfaces on a shared platform
          vi: Giao diện sản phẩm được công bố trên nền tảng chung
        - en: Catalogs, knowledge graphs, automated pipelines and virtualization
          vi: Catalog, knowledge graph, pipeline tự động và ảo hóa dữ liệu
      - - en: Strengths
          vi: Điểm mạnh
        - en: Consistent standards; efficient for small and mid-size organizations
          vi: Chuẩn nhất quán; hiệu quả với tổ chức vừa và nhỏ
        - en: Scales with the number of domains; puts knowledge next to the data
          vi: Scale theo số domain; đặt hiểu biết nghiệp vụ cạnh dữ liệu
        - en: Fast access across many systems without moving them first
          vi: Truy cập nhanh xuyên nhiều hệ thống mà không cần di chuyển trước
      - - en: Risks
          vi: Rủi ro
        - en: The central team becomes a bottleneck and lacks domain context
          vi: Đội trung tâm thành nút thắt và thiếu bối cảnh nghiệp vụ
        - en: Domains without data skills; duplicated tooling; weak interoperability
          vi: Domain thiếu kỹ năng dữ liệu; công cụ trùng lặp; khả năng liên thông yếu
        - en: Heavy reliance on metadata quality and on vendor products
          vi: Phụ thuộc nặng vào chất lượng metadata và sản phẩm của vendor
      - - en: Fits when
          vi: Phù hợp khi
        - en: Few domains, one main analytics consumer
          vi: Ít domain, một bên tiêu thụ analytics chính
        - en: Many autonomous domains and a strong platform team
          vi: Nhiều domain tự chủ và một đội nền tảng mạnh
        - en: Data spread across many systems that cannot be consolidated soon
          vi: Dữ liệu trải trên nhiều hệ thống chưa thể hợp nhất sớm
    cap:
      en: Most organizations end up hybrid — a central platform team, domain-owned data products and fabric-style metadata to connect what cannot be moved.
      vi: Phần lớn tổ chức kết thúc ở dạng lai — một đội nền tảng trung tâm, data product do domain sở hữu và metadata kiểu fabric để kết nối những gì chưa thể di chuyển.
    n:
      en: Data mesh was described by Zhamak Dehghani; data fabric is mostly an analyst and vendor term. Ask what problem the label is solving before adopting it.
      vi: Data mesh do Zhamak Dehghani mô tả; data fabric phần lớn là thuật ngữ của giới phân tích và vendor. Hãy hỏi cái nhãn đó giải quyết vấn đề gì trước khi áp dụng.
  - id: data-silos-and-data-virtualization
    k: cards
    t:
      en: Data silos and data virtualization
      vi: Silo dữ liệu và ảo hóa dữ liệu
    lead:
      en: A data silo is data locked in one team's system, out of reach of the rest of the business. Data virtualization is one way to query across silos without copying data first.
      vi: Silo dữ liệu là dữ liệu bị khóa trong hệ thống của một đội, ngoài tầm với của phần còn lại của doanh nghiệp. Ảo hóa dữ liệu là một cách truy vấn xuyên silo mà không cần sao chép trước.
    cols: 3
    cards:
      - h:
          en: Why silos form
          vi: Vì sao silo hình thành
        tag: must
        p:
          en: Team-bought SaaS tools, acquisitions, separate budgets, security rules and Conway's law — systems mirror the org chart.
          vi: Công cụ SaaS do từng đội tự mua, sáp nhập, ngân sách tách biệt, quy định bảo mật và định luật Conway — hệ thống phản chiếu sơ đồ tổ chức.
      - h:
          en: What silos cost
          vi: Silo gây tốn kém gì
        tag: must
        p:
          en: Conflicting numbers in meetings, duplicated pipelines and storage, no single view of a customer, and compliance blind spots.
          vi: Số liệu mâu thuẫn trong các cuộc họp, pipeline và storage trùng lặp, không có cái nhìn duy nhất về khách hàng, và điểm mù tuân thủ.
      - h:
          en: Data virtualization
          vi: Ảo hóa dữ liệu
        tag: senior
        p:
          en: A virtual layer exposes many sources as one set of tables. Queries are translated and sent to the sources at run time; nothing is copied.
          vi: Một lớp ảo trình bày nhiều nguồn như một tập bảng. Query được dịch và gửi đến nguồn lúc chạy; không có gì bị sao chép.
      - h:
          en: Federation and pushdown
          vi: Federation và pushdown
        tag: senior
        p:
          en: A federated engine such as Trino, Dremio or Denodo pushes filters and aggregates into each source and joins the reduced results itself.
          vi: Một engine federation như Trino, Dremio hay Denodo đẩy bộ lọc và phép tổng hợp xuống từng nguồn và tự join các kết quả đã thu gọn.
      - h:
          en: Trade-offs
          vi: Đánh đổi
        tag: senior
        p:
          en: Fresh data and quick to start, but it loads operational systems, large cross-source joins are slow, and there is no history unless the source keeps it.
          vi: Dữ liệu mới và khởi động nhanh, nhưng nó tạo tải lên hệ thống vận hành, join lớn giữa các nguồn chậm, và không có lịch sử trừ khi nguồn tự lưu.
      - h:
          en: Pairing with a lakehouse
          vi: Kết hợp với lakehouse
        tag: senior
        p:
          en: Virtualize the long tail and exploration; materialize hot, heavily joined data into Iceberg tables once usage proves the need.
          vi: Ảo hóa phần đuôi dài và việc khám phá; vật chất hóa dữ liệu nóng, hay được join vào bảng Iceberg khi mức sử dụng chứng minh nhu cầu.
    n:
      en: Silos are an organizational problem first. Technology can connect them, but agreeing on shared definitions and ownership is what removes the conflicting numbers.
      vi: Silo trước hết là vấn đề tổ chức. Công nghệ có thể kết nối chúng, nhưng thống nhất định nghĩa chung và quyền sở hữu mới là thứ xóa bỏ số liệu mâu thuẫn.
  - id: center-of-excellence-and-change-management
    k: cards
    t:
      en: Center of Excellence and change management
      vi: Center of Excellence và quản lý thay đổi
    lead:
      en: New platforms rarely fail on technology; they fail when people keep using the old spreadsheet. A Center of Excellence and deliberate change management drive adoption.
      vi: Nền tảng mới hiếm khi thất bại vì công nghệ; chúng thất bại khi mọi người vẫn dùng bảng tính cũ. Một Center of Excellence và quản lý thay đổi có chủ đích thúc đẩy việc áp dụng.
    cols: 3
    cards:
      - h:
          en: Center of Excellence (CoE)
          vi: Center of Excellence (CoE)
        tag: senior
        p:
          en: A small central team that sets standards, curates reusable patterns, trains people and supports governance for data work across the company.
          vi: Một đội trung tâm nhỏ đặt chuẩn, tuyển chọn các mẫu tái sử dụng, đào tạo và hỗ trợ quản trị cho công việc dữ liệu trên toàn công ty.
      - h:
          en: CoE in a data mesh
          vi: CoE trong data mesh
        tag: senior
        p:
          en: It becomes the enabling team behind the self-serve platform and federated governance, coaching domains rather than doing their work. An approval queue defeats the purpose.
          vi: Nó trở thành đội hỗ trợ đứng sau nền tảng tự phục vụ và quản trị liên bang, huấn luyện các domain thay vì làm thay. Một hàng đợi phê duyệt sẽ phá hỏng mục đích.
      - h:
          en: Change management
          vi: Quản lý thay đổi
        tag: senior
        p:
          en: The structured work of moving people from the old way to the new one, covering why, what changes for each role, and support during the switch.
          vi: Công việc có cấu trúc nhằm đưa mọi người từ cách cũ sang cách mới, gồm lý do, điều gì thay đổi với từng vai trò, và hỗ trợ trong lúc chuyển đổi.
      - h:
          en: Levers that work
          vi: Các đòn bẩy hiệu quả
        tag: senior
        p:
          en: A visible executive sponsor, data champions inside each team, training by role, a pilot domain before the wide rollout, and a published date to retire the old path.
          vi: Một nhà bảo trợ cấp cao hiện diện, data champion trong từng đội, đào tạo theo vai trò, một domain thí điểm trước khi triển khai rộng, và ngày công bố ngừng đường cũ.
      - h:
          en: Measure adoption
          vi: Đo mức áp dụng
        tag: senior
        p:
          en: Active users, queries on the new platform versus the legacy one, legacy reports retired, and support tickets over time.
          vi: Người dùng hoạt động, số query trên nền tảng mới so với hệ thống cũ, số báo cáo cũ đã ngừng, và ticket hỗ trợ theo thời gian.
      - h:
          en: Pitfalls
          vi: Cạm bẫy
        tag: senior
        p:
          en: Announcing a launch and calling it done, running old and new in parallel forever, and training once instead of supporting people in their real work.
          vi: Thông báo ra mắt rồi coi như xong, chạy song song cũ và mới mãi mãi, và đào tạo một lần thay vì hỗ trợ mọi người trong công việc thật.
    n:
      en: A migration is finished when the old system is switched off, not when the new one is switched on. Put the decommission date in the plan from the start.
      vi: Một cuộc migration chỉ hoàn tất khi hệ thống cũ bị tắt, không phải khi hệ thống mới được bật. Hãy đưa ngày ngừng hệ thống cũ vào kế hoạch ngay từ đầu.
  - id: data-monetization-internal-and-external
    k: table
    t:
      en: "Data monetization: internal and external strategies"
      vi: "Kiếm tiền từ dữ liệu: chiến lược nội bộ và bên ngoài"
    lead:
      en: Data monetization turns data into measurable financial value. Internal strategies improve the business you already run; external ones create new revenue, with more risk.
      vi: Kiếm tiền từ dữ liệu là biến dữ liệu thành giá trị tài chính đo được. Chiến lược nội bộ cải thiện mảng kinh doanh hiện có; chiến lược bên ngoài tạo doanh thu mới, kèm rủi ro cao hơn.
    head:
      - en: Strategy
        vi: Chiến lược
      - en: How value is created
        vi: Giá trị được tạo ra thế nào
      - en: Example
        vi: Ví dụ
      - en: Main risk
        vi: Rủi ro chính
    rows:
      - - en: Better decisions (internal)
          vi: Quyết định tốt hơn (nội bộ)
        - en: More revenue or less loss from smarter choices
          vi: Tăng doanh thu hoặc giảm tổn thất nhờ lựa chọn thông minh hơn
        - en: Pricing optimization, churn prevention, targeted marketing
          vi: Tối ưu giá, ngăn churn, marketing nhắm mục tiêu
        - en: Value is hard to attribute without experiments
          vi: Khó quy giá trị nếu không có thí nghiệm
      - - en: Process efficiency (internal)
          vi: Hiệu quả quy trình (nội bộ)
        - en: Lower cost through automation and prediction
          vi: Giảm chi phí nhờ tự động hóa và dự báo
        - en: Demand forecasting, fraud detection, predictive maintenance
          vi: Dự báo nhu cầu, phát hiện gian lận, bảo trì dự đoán
        - en: Models decay; savings fade without monitoring
          vi: Mô hình suy giảm; khoản tiết kiệm mất dần nếu không giám sát
      - - en: Data-enhanced products (external)
          vi: Sản phẩm tăng cường bằng dữ liệu (bên ngoài)
        - en: Customers pay more or stay longer for insight built into the product
          vi: Khách hàng trả nhiều hơn hoặc ở lại lâu hơn nhờ insight tích hợp trong sản phẩm
        - en: Embedded analytics, peer benchmarks, recommendations
          vi: Analytics nhúng, benchmark so với đồng ngành, gợi ý
        - en: Multi-tenant data leaks; latency and SLA obligations
          vi: Rò rỉ dữ liệu giữa các tenant; nghĩa vụ về độ trễ và SLA
      - - en: Selling or licensing data (external)
          vi: Bán hoặc cấp phép dữ liệu (bên ngoài)
        - en: Direct revenue from data sets, feeds or data APIs
          vi: Doanh thu trực tiếp từ tập dữ liệu, feed hoặc data API
        - en: Data marketplaces, secure data sharing, aggregated market indices
          vi: Data marketplace, chia sẻ dữ liệu an toàn, chỉ số thị trường tổng hợp
        - en: Privacy law, consent and re-identification; contract terms; reputational damage
          vi: Luật bảo vệ dữ liệu cá nhân, sự đồng ý và tái định danh; điều khoản hợp đồng; tổn hại uy tín
    cap:
      en: Start internal, where the data is already allowed and the value is easier to prove. Go external only with legal review, aggregation and a clear product owner.
      vi: Hãy bắt đầu từ nội bộ, nơi dữ liệu đã được phép dùng và giá trị dễ chứng minh hơn. Chỉ ra bên ngoài khi có rà soát pháp lý, tổng hợp ẩn danh và người sở hữu sản phẩm rõ ràng.
    n:
      en: The engineering prerequisites are the same in every row — quality, lineage, access control and usage tracking. Without usage data you cannot show the value or price it.
      vi: Điều kiện kỹ thuật tiên quyết giống nhau ở mọi dòng — chất lượng, lineage, kiểm soát truy cập và theo dõi mức sử dụng. Không có dữ liệu sử dụng thì bạn không chứng minh được giá trị hay định giá được.
  - id: open-source-software-and-the-apache-software-foundation
    k: cards
    t:
      en: Open-source software and the Apache Software Foundation
      vi: Phần mềm mã nguồn mở và Apache Software Foundation
    lead:
      en: Most of the modern data stack is open-source software — code released under a license that lets anyone use, inspect, modify and redistribute it. Licenses and governance decide how safe it is to build on.
      vi: Phần lớn modern data stack là phần mềm mã nguồn mở — code phát hành theo giấy phép cho phép bất kỳ ai dùng, xem, sửa và phân phối lại. Giấy phép và mô hình quản trị quyết định việc xây dựng trên nó an toàn đến đâu.
    cols: 3
    cards:
      - h:
          en: License families
          vi: Các nhóm giấy phép
        tag: must
        p:
          en: Permissive (Apache 2.0, MIT, BSD) allow almost any use; copyleft (GPL, AGPL) requires sharing changes under the same terms. Apache 2.0 also grants patent rights.
          vi: Giấy phép dễ dãi (Apache 2.0, MIT, BSD) cho phép gần như mọi cách dùng; copyleft (GPL, AGPL) yêu cầu chia sẻ thay đổi theo cùng điều khoản. Apache 2.0 còn cấp quyền về bằng sáng chế.
      - h:
          en: Source-available is not open source
          vi: Source-available không phải mã nguồn mở
        tag: senior
        p:
          en: Licenses such as BSL, SSPL or the Elastic License restrict competing use. Relicensing has triggered community forks such as OpenSearch and OpenTofu.
          vi: Các giấy phép như BSL, SSPL hay Elastic License hạn chế việc dùng để cạnh tranh. Việc đổi giấy phép đã dẫn đến các bản fork cộng đồng như OpenSearch và OpenTofu.
      - h:
          en: Business models
          vi: Mô hình kinh doanh
        tag: senior
        p:
          en: Open core with paid features, a managed cloud service, or support and services. A single-vendor project can change its license when the business needs it.
          vi: Open core kèm tính năng trả phí, dịch vụ cloud managed, hoặc hỗ trợ và dịch vụ. Một dự án do một vendor kiểm soát có thể đổi giấy phép khi kinh doanh cần.
      - h:
          en: The Apache Software Foundation
          vi: Apache Software Foundation
        tag: must
        p:
          en: A US nonprofit founded in 1999 that hosts Spark, Kafka, Flink, Airflow, Iceberg, Arrow and Parquet. It owns the trademarks, so no single company controls a project.
          vi: Một tổ chức phi lợi nhuận tại Mỹ thành lập năm 1999, đang nuôi dưỡng Spark, Kafka, Flink, Airflow, Iceberg, Arrow và Parquet. Nó sở hữu thương hiệu, nên không công ty nào một mình kiểm soát dự án.
      - h:
          en: The Apache Way and the Incubator
          vi: Apache Way và Incubator
        tag: senior
        p:
          en: Community over code, decisions in public on mailing lists, voting by committers and a project management committee. New projects enter the Incubator and graduate to top-level status.
          vi: Cộng đồng quan trọng hơn code, quyết định công khai trên mailing list, bỏ phiếu bởi committer và ủy ban quản lý dự án (PMC). Dự án mới vào Incubator và tốt nghiệp thành dự án cấp cao nhất.
      - h:
          en: Choosing OSS for a platform
          vi: Chọn OSS cho nền tảng
        tag: senior
        p:
          en: Check the license, foundation versus single-vendor governance, contributor diversity, release cadence and how security issues are handled — not just GitHub stars.
          vi: Kiểm tra giấy phép, quản trị bởi quỹ hay bởi một vendor, độ đa dạng người đóng góp, nhịp phát hành và cách xử lý lỗ hổng bảo mật — không chỉ số sao GitHub.
    n:
      en: "Free to download is not free to run: OSS shifts cost from licenses to people. Foundation governance lowers the risk of a sudden license change, which is why table formats under the ASF are a common lock-in hedge. This is not legal advice; involve legal for license questions."
      vi: "Tải miễn phí không có nghĩa là vận hành miễn phí: OSS chuyển chi phí từ giấy phép sang con người. Quản trị bởi quỹ giảm rủi ro đổi giấy phép đột ngột, vì vậy các table format thuộc ASF là cách phòng ngừa lock-in phổ biến. Đây không phải tư vấn pháp lý; hãy hỏi bộ phận pháp chế về giấy phép."
  - id: checklist-and-interview-questions
    k: check
    t:
      en: Checklist and interview questions
      vi: Checklist và câu hỏi phỏng vấn
    left:
      h:
        en: Self-check
        vi: Tự kiểm tra
      items:
        - en: I write ADRs for significant decisions
          vi: Tôi viết ADR cho các quyết định quan trọng
        - en: I can facilitate a metric-definition alignment
          vi: Tôi có thể điều phối việc thống nhất định nghĩa metric
        - en: I use a scorecard for build-versus-buy
          vi: Tôi dùng scorecard cho quyết định build-versus-buy
        - en: I know my team’s top cost drivers
          vi: Tôi biết các yếu tố chi phí lớn nhất của team mình
        - en: I mentor at least one person deliberately
          vi: Tôi mentor ít nhất một người một cách có chủ đích
        - en: I can say no with an alternative
          vi: Tôi có thể từ chối kèm phương án thay thế
    right:
      h:
        en: Interview-style questions
        vi: Câu hỏi kiểu phỏng vấn
      items:
        - en: Two executives disagree on the definition of “active user”. What do you do?
          vi: Hai giám đốc bất đồng về định nghĩa “active user”. Bạn làm gì?
        - en: A stakeholder demands a real-time dashboard. How do you respond?
          vi: Một stakeholder đòi dashboard real-time. Bạn phản hồi thế nào?
        - en: Tell me about a technical decision you reversed.
          vi: Hãy kể về một quyết định kỹ thuật bạn đã đảo ngược.
        - en: How do you decide whether to build or buy an ingestion tool?
          vi: Bạn quyết định tự build hay mua một công cụ ingestion như thế nào?
        - en: How do you get a junior engineer to own a system?
          vi: Làm sao để một kỹ sư junior chịu trách nhiệm một hệ thống?
    n:
      en: "Good answers are specific: a real situation, the options, the trade-off, the outcome and what was learned."
      vi: "Câu trả lời tốt phải cụ thể: một tình huống thật, các phương án, sự đánh đổi, kết quả và bài học rút ra."
