layer: 1
slides:
  - id: core-languages-the-tools-you-think-in
    k: cards
    t:
      en: "Core languages: the tools you think in"
      vi: "Ngôn ngữ nền tảng: công cụ bạn dùng để tư duy"
    lead:
      en: Everything else in the stack is configuration around a handful of languages. Seniors write SQL that stays fast and readable at 100x the data, and reach for Python only where SQL stops being the right tool.
      vi: Mọi thứ khác trong stack chỉ là cấu hình xoay quanh vài ngôn ngữ. Senior viết SQL vẫn nhanh và dễ đọc khi dữ liệu gấp 100 lần, và chỉ dùng Python khi SQL không còn là công cụ phù hợp.
    cols: 3
    cards:
      - h: SQL
        tag: must
        p:
          en: "The main interface to the warehouse: window functions, CTEs, recursive queries, reading query plans."
          vi: "Giao diện chính với warehouse: window function, CTE, recursive query, đọc query plan."
      - h: Python
        tag: must
        p:
          en: "Glue, ingestion, tests and anything procedural: pandas, polars, DuckDB, PySpark, pytest."
          vi: "Glue, ingestion, test và mọi việc mang tính thủ tục: pandas, polars, DuckDB, PySpark, pytest."
      - h: Jinja
        tag: must
        p:
          en: Templating in dbt and Airflow. Turns repeated SQL into macros, and can also make code unreadable.
          vi: Templating trong dbt và Airflow. Biến SQL lặp lại thành macro, nhưng cũng có thể khiến code khó đọc.
      - h: YAML
        tag: must
        p:
          en: Configuration for dbt, CI and orchestrators. Indentation is meaning, so lint it.
          vi: Cấu hình cho dbt, CI và orchestrator. Thụt lề mang ý nghĩa, nên hãy lint nó.
      - h: Bash
        tag: nice
        p:
          en: Glue for CI jobs, containers and local tooling. Keep scripts short and fail fast with `set -euo pipefail`.
          vi: Glue cho CI job, container và công cụ local. Giữ script ngắn và fail fast với `set -euo pipefail`.
      - h:
          en: Why it matters
          vi: Vì sao quan trọng
        tag: senior
        p:
          en: Language choice decides who can maintain the code. Prefer the simplest tool the whole team can read.
          vi: Lựa chọn ngôn ngữ quyết định ai có thể bảo trì code. Ưu tiên công cụ đơn giản nhất mà cả team đọc được.
    n:
      en: "Frame the layer: these are the languages every other layer is written in. The senior signal is not knowing more syntax, it is choosing the simplest tool that the whole team can maintain, and keeping SQL performant as data grows."
      vi: "Đặt khung cho layer: đây là các ngôn ngữ mà mọi layer khác được viết bằng. Dấu hiệu của người senior không phải là biết nhiều cú pháp hơn, mà là chọn công cụ đơn giản nhất cả team có thể bảo trì, và giữ SQL hiệu năng tốt khi dữ liệu tăng."
  - id: language-and-library-landscape
    k: table
    t:
      en: Language and library landscape
      vi: Bức tranh ngôn ngữ và thư viện
    head:
      - en: Tool
        vi: Công cụ
      - en: Type
        vi: Loại
      - en: Best for
        vi: Phù hợp nhất
      - en: Strengths
        vi: Điểm mạnh
      - en: Limitations
        vi: Hạn chế
      - en: Pricing model
        vi: Mô hình giá
    rows:
      - - SQL
        - en: Query language
          vi: Ngôn ngữ truy vấn
        - en: Set-based transforms in the warehouse
          vi: Biến đổi theo tập hợp (set-based) trong warehouse
        - en: Declarative, optimizer does the work, universal skill
          vi: Khai báo, optimizer lo phần việc, kỹ năng phổ quát
        - en: Dialect differences; awkward for procedural logic
          vi: Khác biệt giữa các dialect; khó viết logic thủ tục
        - en: Free; you pay for compute
