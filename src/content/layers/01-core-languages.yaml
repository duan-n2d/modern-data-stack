      - - pandas
        - en: Python dataframe library
          vi: Thư viện dataframe của Python
        - en: Small to medium in-memory analysis
          vi: Phân tích in-memory quy mô nhỏ đến trung bình
        - en: Huge ecosystem, familiar API
          vi: Hệ sinh thái khổng lồ, API quen thuộc
        - en: Memory-bound, mostly single-threaded
          vi: Giới hạn bởi bộ nhớ, chủ yếu đơn luồng
        - en: Open source
          vi: Mã nguồn mở
      - - polars
        - en: Python/Rust dataframe library
