        - en: Open source
          vi: Mã nguồn mở
      - - DuckDB
        - en: In-process OLAP engine
          vi: Engine OLAP chạy in-process
        - en: Local analytics on Parquet/CSV; testing SQL
          vi: Phân tích local trên Parquet/CSV; test SQL
        - en: Fast columnar SQL, no server, reads files directly
          vi: SQL dạng cột nhanh, không cần server, đọc file trực tiếp
        - en: Single node; limited concurrent writers
          vi: Một node; số writer đồng thời bị hạn chế
        - en: Open source
          vi: Mã nguồn mở
      - - PySpark
